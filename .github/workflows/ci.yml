  # ───────────────────────────────────────────────────────────────────
  # M2-01 — image-supply-chain: بناءُ الصورةِ وعقدُها وقائمةُ موادِها وثغراتُها.
  #
  # هذهِ الوظيفةُ **هيَ الإثباتُ**؛ والحارسُ (الفحصُ 19) يمنعُ مَحوَها ومَحوَ
  # اتّساقِ إعدادِها فحسبُ. ولا وجهَ محلّيَّ لها في هذا المستودعِ: لا `docker`
  # على مكتبِ التنفيذِ، فأخضرُها حكمُ CI لا تقريرٌ يُكتَبُ.
  #
  # ولا إجراءَ من طرفٍ ثالثٍ فيها بقصدٍ: `validate-workflow-supply-chain.sh`
  # يحصرُ الإجراءاتَ المُعلَنةَ، و`syft`/`trivy` تُنزَّلانِ بنسخةٍ **وبِصمةٍ**
  # من `scripts/container/tool-pins.env` وحدَه.
  #
  # وبناءانِ لا بناءٌ واحدٌ: الثانيُّ بـ`--no-cache`، ثمَّ تُقارَنُ **مجموعةُ
  # purl** للقائمتَينِ. فرقٌ واحدٌ يعني أنَّ ما فُحِصَ ليسَ ما يُشحَنُ.
  # ───────────────────────────────────────────────────────────────────
  image-supply-chain:
    name: image-supply-chain
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: "بيئةُ القياسِ"
        run: |
          docker --version
          python3 --version
          gh --version
      # CLM-0576 — بوّابةُ التحقّقِ نفسُها مُختبَرةٌ قبلَ البناء: gh مُصطنَعٌ يخرجُ 0 بتحذيرٍ،
      # أو ببصمةٍ أخرى، أو بإصدارٍ قديم، أو بلا رمز — كلُّها يجبُ أن تفشل.
      - name: "اختباراتُ وحدةٍ لبوّابةِ تحقُّقِ الإثباتِ (CLM-0576)"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/attestation-verify
          bash scripts/ci/test-verify-sbom-attestations.sh 2>&1 | tee artifacts/attestation-verify/unit-tests.txt
      - name: "بناءٌ (1)"
        run: bash scripts/container/build-image.sh wasla:ci-pass1
      - name: "عقدُ الصورةِ — غيرُ جِذرٍ · عقدةٌ مُثبَّتةٌ · كلُّ حزمةٍ لها مدخلٌ"
        run: bash scripts/container/verify-image-contract.sh wasla:ci-pass1
      - name: "قائمةُ الموادِ (1)"
        run: bash scripts/container/generate-sbom.sh wasla:ci-pass1 artifacts/sbom/pass1.cdx.json
      - name: "بناءٌ (2) بلا ذاكرةٍ مؤقّتةٍ"
        run: bash scripts/container/build-image.sh wasla:ci-pass2 --no-cache
      - name: "قائمةُ الموادِ (2)"
        run: bash scripts/container/generate-sbom.sh wasla:ci-pass2 artifacts/sbom/pass2.cdx.json
      - name: "إعادةُ البناءِ — الإغلاقُ نفسُهُ في بناءَينِ"
        run: bash scripts/container/compare-sbom.sh artifacts/sbom/pass1.cdx.json artifacts/sbom/pass2.cdx.json
      - name: "ثغراتُ الصورةِ — HIGH,CRITICAL القابلةُ للإصلاحِ تحجزُ الدمجَ"
        run: bash scripts/container/scan-image.sh wasla:ci-pass1
      - name: "رفعُ أدلّةِ سلسلةِ التوريدِ"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-supply-chain-evidence
          path: |
            artifacts/sbom/
            artifacts/security/
          retention-days: 30
          if-no-files-found: warn
      # M6-19C — إثباتُ أصلِ البناءِ: توقيعُ قوائمِ الموادِ وربطُها بالبناءِ.
      # فعلٌ من طرفٍ أوّلٍ (actions) — لا يحتاجُ تثبيتاً ببصمةٍ. ويُثبِتُ أنَّ
      # ما فُحِصَ هو ما بُنِيَ، لا بيانٌ يُكتَبُ بعدَ البناءِ.
      - name: "إثباتُ أصلِ قوائمِ الموادِ (M6-19C)"
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            artifacts/sbom/pass1.cdx.json
            artifacts/sbom/pass2.cdx.json
      # CLM-0576 — تحقُّقٌ صارمٌ: الملفّانِ كلاهما · المستودعُ نفسُه · سيرُ التوقيعِ ci.yml
      # · نوعُ SLSA provenance v1 · إصدارُ gh مُتحقَّقٌ صراحةً. غيابُ الرمزِ أو فشلُ
      # المصادقةِ أو غيابُ الإثباتِ أو فشلُ التحقّقِ يُفشِلُ الوظيفة — لا تحذيرَ يُمرِّر.
      # GH_TOKEN لهذه الخطوةِ والتي تليها فقط؛ الصلاحيّاتُ أعلاه بلا توسيع.
      - name: "تحقُّقٌ من الإثباتِ"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEST_EVIDENCE_DIR: artifacts/attestation-verify/positive
        run: |
          set -euo pipefail
          mkdir -p artifacts/attestation-verify
          bash scripts/ci/verify-sbom-attestations.sh "${{ github.repository }}" .github/workflows/ci.yml \
            artifacts/sbom/pass1.cdx.json artifacts/sbom/pass2.cdx.json \
            2>&1 | tee artifacts/attestation-verify/positive-both.txt
      # CLM-0576 — اختباراتٌ سلبيّةٌ بـ gh الحقيقيِّ والإثباتِ الحقيقيّ: كلُّ حالةِ فشلٍ
      # يجبُ أن تفشلَ فعلًا؛ وإن نجحت حالةٌ منها فشلت الوظيفة.
      - name: "تحقُّقُ الإثباتِ — حالاتٌ موجبةٌ وسالبةٌ حيّة (CLM-0576)"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/ci/test-verify-sbom-attestations-live.sh "${{ github.repository }}" .github/workflows/ci.yml \
            artifacts/sbom/pass1.cdx.json artifacts/sbom/pass2.cdx.json artifacts/attestation-verify/live
      - name: "رفعُ أدلّةِ تحقُّقِ الإثباتِ (CLM-0576)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-supply-chain-attestation-verify-evidence
          path: artifacts/attestation-verify/
          retention-days: 30
          if-no-files-found: error

# .github/workflows/ci.yml — WASLA CI · النقلُ الأوّلُ إلى GitHub Actions (M0-21)
#
# ── لماذا يوجد هذا الملفُّ ───────────────────────────────────────────────
# `RISK-0001`: خطُّ GitLab لم يبدأ قطُّ منذ 2026-08-25 — كلُّ وظيفةٍ تُنهى بـ
# `ci_quota_exceeded` و`started_at: null`، أي **لا وظيفةَ بدأت أصلاً**. فكلُّ
# أدلّةِ البوّاباتِ في هذا المستودعِ محلّيّةٌ، وخمسةَ عشرَ عنصراً عالقٌ في
# `Ready for Gate` وصفرُ عناصرَ `Completed` (`RISK-0003`).
#
# وهذا الملفُّ **لا يُعيد بناءَ CI**. غرضُه واحدٌ يُقاس: **أن يبدأ خطٌّ فعلاً
# وينفّذَ الشفرةَ ويُخرِجَ نتيجةً قابلةً للتدقيق.** ولذلك نُقل **الحدُّ الأدنى
# المانعُ** وحدَه: ستُّ وظائفَ كنسيّةٌ لا خمسٌ وعشرون. ووظائفُ قاعدةِ البياناتِ
# والبوّاباتُ من طرفٍ إلى طرفٍ (عشرون وظيفةً) **تبقى في `.gitlab-ci.yml` كما هي**
# حتّى يُثبِتَ هذا الخطُّ نفسَه، ثمّ تُنقَل في `M0-22`.
#
#   قرارُ مالكِ البرنامجِ 2026-09-01 · ADR-023 · العنصر M0-21 · الحجز CLM-0031
#
# ── قاعدةُ التكافؤ ──────────────────────────────────────────────────────
# كلُّ وظيفةٍ هنا تُشغِّلُ **الأمرَ نفسَه حرفاً بحرفٍ** كما في `.gitlab-ci.yml`.
# لا تبسيطَ ولا إعادةَ تفسيرٍ ولا تخفيفَ شرطٍ. ومَن أرادَ التحقُّقَ فليقارِن
# سطرَ `run:` بسطرِ `script:` في نظيرِه المذكورِ في تعليقِ كلِّ وظيفة.
#
# ── ما لم يُنقَل ولا يُدَّعى ─────────────────────────────────────────────
#   • `markdown-lint` — إرشاديٌّ (`allow_failure: true` · `RISK-0008`). لا يمنع.
#   • عشرون وظيفةَ `*-db-integration` و`*-exit-gate-e2e` — نطاقُ `M0-22`.
#
# ── حدٌّ مُعلَنٌ لا مكتوم ─────────────────────────────────────────────────
# `scripts/checks/validate-ci-mandatory.sh` (البابُ 1..4) يقرأ `.gitlab-ci.yml`
# **وحدَه**. فهذا الملفُّ اليومَ **غيرُ محروسٍ** بأبوابِه الأربعة: لو حُذفت منه
# وظيفةُ `verify` غداً لَما أسقطَ ذلك بوّابةً. توسيعُ الحارسِ ليقرأَ المصدرَين
# مُسجَّلٌ في `M0-22` ولم يُنفَّذ هنا — لأنّ توسيعَ حارسٍ في الدفعةِ التي تُقاس
# به هو عينُ ما تمنعه قاعدةُ صدقِ القياس.
#
# المرجع: docs/15-decisions/ADR-023-ci-migration-to-github-actions.md
#         docs/00-rules/VERIFY_COMMAND.md · docs/07-security/RISK_REGISTER.md

name: WASLA CI

on:
  push:
    branches: [main]
  # RISK-0025 (CLM-0414, 2026-09-30): no base-branch filter, so a stacked PR
  # (base = another PR's branch) gets the same checks instead of zero checks.
  # The repository is public, so Actions minutes are free.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasla-ci-${{ github.ref }}
  cancel-in-progress: false

env:
  # مثبَّتانِ تثبيتاً تامّاً على بصمةِ الأساسِ docs/12-testing/BASELINE.json
  NODE_VERSION: "20.20.1"
  PNPM_VERSION: "9.15.9"

jobs:
  # ───────────────────────────────────────────────────────────────────
  # 1) repo-structure — نظيرُ `.gitlab-ci.yml : repo-structure`
  #    أربعةُ سكربتاتٍ بالترتيبِ نفسِه، بلا قائمةٍ مضمَّنةٍ هنا (M0-04 البابُ 2).
  # ───────────────────────────────────────────────────────────────────
  repo-structure:
    name: repo-structure
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: validate-repo-structure
        run: bash scripts/checks/validate-repo-structure.sh
      - name: validate-launch-board
        run: bash scripts/checks/validate-launch-board.sh
      - name: validate-work-claims
        run: bash scripts/checks/validate-work-claims.sh
      - name: scan-secrets
        run: bash scripts/checks/scan-secrets.sh
      - name: validate-terraform-scaffold
        run: bash scripts/checks/validate-terraform-scaffold.sh

  # ───────────────────────────────────────────────────────────────────
  # 2) doc-coverage — نظيرُ `.gitlab-ci.yml : doc-coverage`
  #    قاعدةُ التوثيقِ مع كلِّ دفعٍ (PUSH_DOCUMENTATION_RULE).
  #    `TARGET` هنا هو نظيرُ `CI_MERGE_REQUEST_TARGET_BRANCH_NAME` ثمَّ
  #    `CI_DEFAULT_BRANCH` — بالترتيبِ نفسِه.
  # ───────────────────────────────────────────────────────────────────
  doc-coverage:
    name: doc-coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # نظيرُ سلوكِ GitLab: المُشغِّلُ هناك يخرجُ على **فرعٍ مُسمّى**
          # (`CI_COMMIT_REF_NAME`). و`actions/checkout` على حدثِ
          # `pull_request` يخرجُ افتراضاً على **دمجٍ مؤقَّتٍ بـHEAD منفصلٍ**،
          # فيُجيب `git rev-parse --abbrev-ref HEAD` بـ`HEAD` وترفضُ
          # `validate-work-claims.sh` بحقٍّ: «الحجزُ يرتبطُ بفرعٍ مُسمّى».
          # فهذا استرجاعُ التكافؤِ لا تخفيفُ شرطٍ — والفحصُ لم يُمَسّ.
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: require-doc-update
        run: |
          TARGET="${GITHUB_BASE_REF:-main}"
          git fetch origin "$TARGET:refs/remotes/origin/$TARGET" 2>/dev/null || true
          bash scripts/checks/require-doc-update.sh "origin/$TARGET" HEAD

  # ───────────────────────────────────────────────────────────────────
  # 3) governance-guard — نظيرُ `.gitlab-ci.yml : governance-guard`
  #    البوّابةُ الموحَّدةُ ثمَّ حزمةُ الإثباتِ التي تُثبت أنّ الفحوصَ ترفض
  #    فعلاً لا شكلاً. الأمرانِ بالترتيبِ نفسِه.
  # ───────────────────────────────────────────────────────────────────
  governance-guard:
    name: governance-guard
    runs-on: ubuntu-24.04
    # (CLM-0392) الفحصُ 23 يقرأُ فروعَ المنصّةِ وطلباتِ الدمجِ المفتوحةَ. وبلا رمزٍ
    # كانَ يتخطّى في كلِّ تشغيلٍ — فصارَ تعذُّرُ القراءةِ في CI إخفاقاً، ويُعطى هنا
    # **أقلَّ صلاحيّةِ قراءةٍ** تلزمُهُ لا أكثر: إعطاءُ الفحصِ بيئتَهُ لا تعطيلُهُ.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # نظيرُ سلوكِ GitLab: المُشغِّلُ هناك يخرجُ على **فرعٍ مُسمّى**
          # (`CI_COMMIT_REF_NAME`). و`actions/checkout` على حدثِ
          # `pull_request` يخرجُ افتراضاً على **دمجٍ مؤقَّتٍ بـHEAD منفصلٍ**،
          # فيُجيب `git rev-parse --abbrev-ref HEAD` بـ`HEAD` وترفضُ
          # `validate-work-claims.sh` بحقٍّ: «الحجزُ يرتبطُ بفرعٍ مُسمّى».
          # فهذا استرجاعُ التكافؤِ لا تخفيفُ شرطٍ — والفحصُ لم يُمَسّ.
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      # (M0-42) توفيرُ السلسلةِ **قبلَ** البوّابةِ لا تخفيفُ فحصٍ: الفحصُ 14
      # صارَ يقرأُ حكمَ بابِ المُرشِّحاتِ من المُشغِّلِ نفسِهِ (`--verify-filters`)
      # وبابُهُ يستعملُ `pnpm list` — وقبلَها كانَ فحصُ الجردِ الخارجيُّ في
      # `audit_test_invocation.py` يُبطَلُ صامتاً في هذهِ الوظيفةِ بلا pnpm
      # (يُبتلَعُ خطؤُهُ فلا يُقاسُ أصلاً — قِيسَ في [35046705655]). فالبيئةُ
      # التي يقيسُ عليها الفحصُ يجبُ أن تكونَ حاضرةً حينَ يقيسُ — وهوَ عينُ
      # القرارِ المُوثَّقِ في الوظيفةِ `verify` أدناهُ (ADR-023 §6):
      # إعطاءُ الفحصِ بيئتَهُ لا تعطيلُهُ.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: تفعيل pnpm المثبَّت
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          echo "node   $(node --version)"
          echo "pnpm   $(pnpm --version)"
      # (CLM-0523) الحارسُ 28 يحلّلُ حالاتِ أدلّةِ E-18/E-19/E-20 بمحلّلِ TypeScript
      # الفعليِّ (`scripts/checks/lib/ts_evidence.cjs` ⇐ `typescript` من اعتماديّاتِ
      # الجذر). وبلا تثبيتٍ يفشلُ الحارسُ مغلقًا — فهذا إعطاءُ الفحصِ بيئتَهُ
      # لا تعطيلُهُ (ADR-023 §6)، والأمرُ نفسُهُ حرفًا في وظيفةِ `verify`.
      - name: install
        run: pnpm install --frozen-lockfile
      - name: verify-governance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # CLM-0539 (M0-08B): no `--depth` here. This job checks out with
          # fetch-depth: 0, and `git fetch --depth=50` silently turned that full
          # clone shallow, so gate 4(b) of the baseline reported "shallow: not
          # measured" in every run (measured: run 38306302226) and the proof
          # suite could not import repo.commit. Updating the ref needs no depth.
          TARGET="${GITHUB_BASE_REF:-main}"
          git fetch origin "$TARGET:refs/remotes/origin/$TARGET" 2>/dev/null || true
          echo "==> بوابة الحوكمة: النطاق origin/$TARGET..HEAD"
          bash scripts/checks/verify-governance.sh "origin/$TARGET" HEAD
      # السببُ الجذريُّ (2) نفسُه في ADR-023 §6: `test-governance.sh` يُشغِّلُ
      # بابَ الأساسِ (M0-08) الذي يقيسُ `pnpm --version`، وصورةُ
      # `alpine:3.20` في نظيرِ هذه الوظيفةِ تُثبِّتُ
      # `bash git python3 coreutils findutils grep sed` — **بلا pnpm**.
      # فالعيبُ كان قائماً في GitLab هنا أيضاً ولم يُكتشَف لأنّ الوظيفةَ
      # لم تبدأ قطُّ. إعطاءُ الفحصِ بيئتَه لا تعطيلُه.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: تفعيل pnpm المثبَّت
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          echo "node   $(node --version)"
          echo "pnpm   $(pnpm --version)"
      - name: test-governance
        run: |
          echo "==> إثبات أن الفحوص ترفض فعلاً (عدد الحالات يُطبَع في ذيل الحزمة)"
          bash scripts/checks/test-governance.sh

  # ───────────────────────────────────────────────────────────────────
  # 4) verify — نظيرُ `.gitlab-ci.yml : verify`
  #    `VERIFY_SKIP_NODE: "1"` منقولٌ كما هو: هذه الوظيفةُ تحرسُ المدخلَ
  #    الموحَّدَ ولا تُعيد تشغيلَ الأنواعِ والاختباراتِ — لهما وظيفتانِ
  #    مستقلّتانِ أدناه. والأرتفاكتُ يُرفَع `when: always` كما في الأصل.
  # ───────────────────────────────────────────────────────────────────
  verify:
    name: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    env:
      VERIFY_SKIP_NODE: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          # نظيرُ سلوكِ GitLab: المُشغِّلُ هناك يخرجُ على **فرعٍ مُسمّى**
          # (`CI_COMMIT_REF_NAME`). و`actions/checkout` على حدثِ
          # `pull_request` يخرجُ افتراضاً على **دمجٍ مؤقَّتٍ بـHEAD منفصلٍ**،
          # فيُجيب `git rev-parse --abbrev-ref HEAD` بـ`HEAD` وترفضُ
          # `validate-work-claims.sh` بحقٍّ: «الحجزُ يرتبطُ بفرعٍ مُسمّى».
          # فهذا استرجاعُ التكافؤِ لا تخفيفُ شرطٍ — والفحصُ لم يُمَسّ.
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      # `VERIFY_SKIP_NODE=1` يتخطّى **الأنواعَ والاختباراتِ وحدَها**، ولا
      # يتخطّى البابَ الأوّلَ من `M0-08` الذي يقيسُ `env.pnpm` في الأساس.
      # وصورةُ `alpine:3.20` في `.gitlab-ci.yml` تُثبِّتُ `bash git python3 grep`
      # فقط — **بلا node ولا pnpm**، فوظيفةُ `verify` هناك كانت ستُخفِقُ
      # بالسببِ نفسِه لو بدأت يوماً. لم تبدأ، فلم يُكتشَف. هذا أوّلُ تشغيلٍ
      # يكشفُه (INC/ADR-023 §6). وتوفيرُ السلسلةِ ليس تخفيفَ فحصٍ بل
      # إعطاءُ الفحصِ البيئةَ التي يقيسُها.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: تفعيل pnpm المثبَّت
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          echo "node   $(node --version)"
          echo "pnpm   $(pnpm --version)"
      # (CLM-0523) `verify.sh` يشغّلُ بوّابةَ الحوكمةِ وفيها الحارسُ 28، وهوَ يحلّلُ
      # أدلّتَه بـ`typescript` (scripts/checks/lib/ts_evidence.cjs). و`VERIFY_SKIP_NODE=1`
      # يتخطّى الأنواعَ والاختباراتِ وحدَها ولا يُعفي الحارسَ من بيئتِه: قِيسَ في
      # التشغيلِ 38069490474 أنَّه فشلَ مغلقًا هنا بلا تثبيت. الأمرُ نفسُه في governance-guard.
      - name: install
        run: pnpm install --frozen-lockfile
      # CLM-0415: judge the PR's own diff, as governance-guard already does
      # (`GITHUB_BASE_REF`). Without the range, verify.sh compared origin/main..HEAD,
      # so a PR stacked on another open PR failed the claim-scope check on files
      # from the base PR (measured on #553, run 36687220288). The checks are unchanged;
      # only the range they are given is fixed. A push to main keeps the default range.
      - name: verify.sh
        run: |
          if [[ -n "${GITHUB_BASE_REF:-}" ]]; then
            git fetch origin "$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF" 2>/dev/null || true
            bash scripts/verify.sh "origin/$GITHUB_BASE_REF" HEAD
          else
            bash scripts/verify.sh
          fi
      - name: رفع أرتفاكت التحقق
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: artifacts/verify/
          retention-days: 30
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────
  # 5) typecheck — الشطرُ الأوّلُ من `.gitlab-ci.yml : build-test`
  #    فُصلَ عن `test` بقرارِ مالكِ البرنامجِ (2026-09-01) ليكون لكلِّ شرطٍ
  #    في البوّابةِ وظيفةٌ تُقابله وحدَها، فلا يُخفي إخفاقُ أحدِهما الآخر.
  #    الأمرُ نفسُه حرفاً: `pnpm install --frozen-lockfile` ثمَّ `pnpm -r run typecheck`.
  # ───────────────────────────────────────────────────────────────────
  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: تفعيل pnpm المثبَّت
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          echo "node   $(node --version)"
          echo "pnpm   $(pnpm --version)"
      - name: install
        run: pnpm install --frozen-lockfile
      - name: typecheck
        # `pipefail` ليس زينةً: بلا هذه السطرِ تكونُ حالةُ الخروجِ حالةَ `tee`
        # لا حالةَ `pnpm`، **فيصيرُ فحصٌ مطلوبٌ عاجزاً بنيوياً عن الإخفاقِ**.
        # قِيسَ ذلك بمِجَسٍّ أحمرَ متعمَّدٍ في `M0-22E` قبلَ هذا الإصلاحِ.
        run: |
          set -o pipefail
          pnpm -r run typecheck 2>&1 | tee typecheck.log
      - name: رفع سجل الأنواع
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-log
          path: typecheck.log
          retention-days: 30
          if-no-files-found: warn

  # ───────────────────────────────────────────────────────────────────
  # 6) test — الشطرُ الثاني من `.gitlab-ci.yml : build-test`
  #    `scripts/run-tests.sh` — مصدرُ الاستدعاءِ الواحدُ (`M0-35`). ولا قاعدةَ
  #    بياناتٍ هنا بقصدٍ: اختباراتُ
  #    التكاملِ مستثناةٌ من الإعدادِ الافتراضيِّ بحارسٍ قائمٍ (M0-03)، ونقلُها
  #    نطاقُ `M0-22`.
  # ───────────────────────────────────────────────────────────────────
  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: تفعيل pnpm المثبَّت
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          echo "node   $(node --version)"
          echo "pnpm   $(pnpm --version)"
      - name: install
        run: pnpm install --frozen-lockfile
      - name: test
        # المِجَسُّ الأحمرُ في `M0-22E` أدخلَ اختباراً **يُخفِقُ بقصدٍ**، فأخفقَ
        # محلياً وبقيَ هذا الفحصُ **أخضرَ** في الخطِّ — لأنّ حالةَ الخروجِ كانت
        # حالةَ `tee`. **فالخضرةُ كانت صامتةً لا صادقةً**، و`pipefail` يُصلِحُ
        # السببَ لا العرَضَ.
        run: |
          set -o pipefail
          bash scripts/run-tests.sh 2>&1 | tee test.log
      - name: رفع سجل الاختبارات
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log
          retention-days: 30
          if-no-files-found: warn

  # ───────────────────────────────────────────────────────────────────
  # M0-22B — الوظائفُ العشرون الباقيةُ من `.gitlab-ci.yml`.
  #
  # كلُّ وظيفةٍ من العشرين في GitLab كانت `extends: .db-integration-base`
  # بالبنيةِ نفسِها حرفاً: `node:20-alpine` · corepack · خدمةُ `postgres:17` (كانت `postgres:15` حتى CLM-0414)
  # واحدةٌ باسمِ قاعدةٍ مستقلٍّ · متغيّرُ وصلٍ واحدٌ · ثمّ أمرانِ:
  #   pnpm install --frozen-lockfile
  #   pnpm --filter <pkg> <script>
  # فالاختلافُ بينَها **بياناتٌ لا منطقٌ**، ولذلك تُنقَل مصفوفةً لا عشرينَ
  # كتلةً متطابقةً — وكلُّ ساقٍ تبقى فحصاً مستقلَّ الاسمِ والنتيجةِ، فيبقى
  # الإخفاقُ منسوباً إلى وظيفةٍ واحدةٍ كما نصَّ تعليقُ `.gitlab-ci.yml`.
  #
  # وثلاثةُ فروقٍ عن GitLab تُعلَن ولا تُطوى (ADR-023 §7):
  #   1. الصورةُ `node:20-alpine` مُبقاةٌ عبرَ `container:` لا عبرَ `runs-on`،
  #      فتبقى خدمةُ `postgres` مُخاطَبةً بالاسمِ `postgres` كما في GitLab
  #      لا بـ`localhost` — وهذا يُبقي سلاسلَ الوصلِ **حرفاً كما هي**.
  #   2. alpine بلا `git`، وactions/checkout يحتاجه — فيُضاف `apk add git`.
  #      وGitLab لم يحتَجه لأنّ عامِلَه يجلبُ الشفرةَ خارجَ الحاويةِ.
  #   3. GitHub لا يعرف `variables:` على مستوى الوظيفةِ باسمٍ متغيّرٍ، واسمُ
  #      متغيّرِ الوصلِ يختلفُ بينَ السيقانِ (`DATABASE_URL` تارةً و
  #      `CUSTOMER_DATABASE_URL` تارةً) — وهو **فرقٌ مقصودٌ** شرحه
  #      `.gitlab-ci.yml`، فيُكتب المتغيّرُ إلى `$GITHUB_ENV` باسمِه من
  #      المصفوفةِ حفاظاً على القصدِ لا تبسيطاً له.
  #
  # وانتظارُ جاهزيّةِ القاعدةِ صريحٌ بـ`health-cmd`: GitLab كان يشغّل الخدمةَ
  # ولا يضمنُ جاهزيّتَها، وكان الاختبارُ نفسُه يتحمّلُ ذلك. الانتظارُ هنا
  # يزيدُ الوثوقيّةَ ولا يغيّر ما يُفحَص.
  # ───────────────────────────────────────────────────────────────────
  db-integration:
    name: db-integration
    runs-on: ubuntu-24.04
    container: node:20-alpine
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: identity
            pkg: "@wasla/identity-service"
            db: wasla_test
          - leg: geography
            pkg: "@wasla/geography-service"
            db: wasla_geo_test
          # `M1-03` · إغلاقُ `RISK-0015` (ADR-035): المخزنُ المشترَكُ لآثارِ رموزِ
          # الخدمةِ. وثلاثةُ أسئلةٍ لا يُجيبُ عنها اختبارُ وحدةٍ إطلاقاً — الاشتراكُ
          # بينَ نسختَينِ، والذَّرِّيّةُ تحتَ التوازي، واستعادةُ الصفِّ المنتهي — فهذه
          # الساقُ هيَ **الموضعُ الوحيدُ** الذي يُصدِّقُ إغلاقَ الخطرِ أو يُكذِّبُهُ.
          - leg: service-auth
            pkg: "@wasla/service-auth"
            db: wasla_replay_test
          - leg: channel
            pkg: "@wasla/channel-postgres"
            db: wasla_channel_test
          - leg: customer
            pkg: "@wasla/customers-service"
            db: wasla_customer_test
          - leg: order
            pkg: "@wasla/orders-service"
            db: wasla_orders_test
          - leg: matching
            pkg: "@wasla/matching-service"
            db: wasla_matching_test
          - leg: dispatch
            pkg: "@wasla/dispatch-service"
            db: wasla_dispatch_test
          - leg: drivers
            pkg: "@wasla/drivers-service"
            db: wasla_drivers_test
          - leg: negotiations
            pkg: "@wasla/negotiations-service"
            db: wasla_negotiations_test
          - leg: reputation
            pkg: "@wasla/reputation-service"
            db: wasla_reputation_test
          - leg: subscriptions
            pkg: "@wasla/subscriptions-service"
            db: wasla_subscriptions_test
          - leg: marketplace
            pkg: "@wasla/marketplace-service"
            db: wasla_marketplace_test
          # `M5-12` · المراجعةُ 4/N — قاعدةُ قراءةِ البحثِ (`ADR-025` §4 رفعُ التأجيلِ).
          # عشرةُ اختباراتٍ تمسُّ `pg_trgm` والفهرسةَ النصيّةَ ومحوّلَ القراءةِ — وكانت تُدارُ
          # يداً في المراجعاتِ الثلاثِ الماضيةِ. وما يُدارُ يداً ليس حارساً.
          - leg: search
            pkg: "@wasla/search-service"
            db: wasla_search_test
          # `M5-13` · المراجعةُ 3/N — محوّلاتُ PostgreSQL لمستهلكِ dispatch (ADR-026 §4.2
          # رفعُ التأجيل): أحد عشرَ اختباراً يُثبتُ ما لا تُثبتُهُ البدائلُ الذهنيّةُ —
          # الذرّيّةُ عندَ فشلٍ وسطَ المعاملةِ، ومنعُ التكرارِ بعدَ فقدانِ نقطةِ التقدّمِ،
          # وعلامةُ الماءِ عبرَ دورةِ timestamptz كاملة، وأنّ المخططَ المطبَّقَ هو ملفُّ
          # العقدِ من القرص. وكانت تُدارُ يداً — وما يُدارُ يداً ليس حارساً.
          - leg: delivery
            pkg: "@wasla/delivery-service"
            db: wasla_delivery_test
          # `M5-14` · Partner/Enterprise — PostgreSQL adapters (6 stores):
          # credential-store, webhook-store, usage-store, audit-store,
          # lifecycle-store, store-staff-port. 3 integration test files (17 tests).
          - leg: partners
            pkg: "@wasla/partners-service"
            db: wasla_partners_test
          # `M5-17P` · Billing — PostgresSettlement · outbox publisher · relay
          # checkpoint + consumed-events ledger; reconciliation gate on real
          # Postgres + migration upgrade proof. 2 integration test files.
          - leg: billing
            pkg: "@wasla/billing-service"
            db: wasla_billing_test
          # `CLM-0552` · bot-runtime — the composed bot on a live Postgres: an end-to-end
          # /start persisted to the three channel tables through the env-built stores,
          # de-duplication surviving a process restart (the guarantee the in-memory path
          # loses), and /health probing the real pool (RISK-0058 · ADR-059). The context
          # was already required on `main` (measured 2026-10-14T05:05:53Z) with no job
          # producing it, which blocked every PR — this leg is the producer, not a waiver.
          - leg: bot-runtime
            pkg: "@wasla/bot-runtime"
            db: wasla_bot_runtime_test
    services:
      postgres:
        image: postgres:17  # CLM-0414: production (Supabase) is PostgreSQL 17 — CI measures the same major
        env:
          POSTGRES_DB: ${{ matrix.db }}
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: git داخل alpine (لا يأتي مع الصورة)
        # المعالجةُ الجذريّةُ لـ`M0-22E`: محاولةٌ واحدةٌ تجعلُ الوظيفةَ رهينةَ ومضةِ
        # شبكةٍ واحدةٍ — وقد أخفقت فعلاً في التشغيلِ `33929916295` (وظيفةٌ واحدةٌ من
        # سبعٍ وعشرينَ، ماتت عندَ هذه الخطوةِ قبلَ `checkout`). فالإعادةُ **مُعلَنةٌ
        # لا صامتةٌ**: ثلاثُ محاولاتٍ بتراجعٍ 5s ثمّ 15s، وكلُّ محاولةٍ تُطبَعُ باسمِها
        # فتبقى الهشاشةُ **مرئيّةً في السجلِّ**، **والإخفاقُ بعدَ الثالثةِ يبقى
        # إخفاقاً** — فلا عيبٌ حقيقيٌّ يُخفى خلفَ إعادةٍ. والصَّدَفةُ `sh` لا `bash`
        # لأنّ `bash` نفسَه لم يُثبَّت بعدُ في هذه اللحظةِ.
        run: |
          set -eu
          for attempt in 1 2 3; do
            echo "apk add: محاولة ${attempt}/3"
            if apk add --no-cache git bash; then
              echo "apk add: نجحت في المحاولة ${attempt}"
              exit 0
            fi
            if [ "${attempt}" = 3 ]; then
              break
            fi
            delay=$(( attempt * 10 - 5 ))
            echo "apk add: أخفقت — انتظار ${delay}s ثم إعادة"
            sleep "${delay}"
          done
          echo "apk add: أخفقت ثلاث محاولات متتالية — الإخفاق يبقى إخفاقاً" >&2
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: تفعيل pnpm المثبَّت
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          echo "node   $(node --version)"
          echo "pnpm   $(pnpm --version)"
      - name: install
        run: pnpm install --frozen-lockfile
      - name: "${{ matrix.leg }} · test:integration"
        env:
          DATABASE_URL: postgres://postgres:postgres@postgres:5432/${{ matrix.db }}
        run: pnpm --filter ${{ matrix.pkg }} test:integration

  # ───────────────────────────────────────────────────────────────────
  # M0-18 — عدّاءٌ واحدٌ · قاعدةٌ واحدةٌ · اثنتا عشرةَ مجموعةً تِباعاً.
  #
  # `db-integration` أعلاه مصفوفةٌ تُعطي كلَّ ساقٍ **قاعدةً مستقلّةً**، فهي
  # تُثبِتُ أنّ كلَّ خدمةٍ تعملُ **وحدَها** ولا تقولُ شيئاً عن عملِها **معاً**.
  # و`RISK-0014` رُصد بالضبطِ في الفجوةِ بينَهما: توكيدٌ في مجموعةِ المطابقةِ
  # كان يقرأُ **كلَّ** جداولِ القاعدةِ فيرى 53 جدولاً بدلَ 6 حينَ تسبقُه
  # خدماتٌ أخرى على القاعدةِ نفسِها. فصارت نتيجةُ المجموعةِ **دالّةً في
  # ترتيبِ التشغيلِ** لا في الشفرةِ وحدَها.
  #
  # و[`LOCAL_POSTGRES_FOR_TESTS.md` §3](../../docs/14-runbooks/LOCAL_POSTGRES_FOR_TESTS.md)
  # تُعلنُ الاشتراكَ آمناً — فهذه الوظيفةُ هي **الفحصُ الذي يُصدِّقُ الوصفةَ
  # أو يُكذِّبها**، لا زينةٌ فوقَ المصفوفةِ.
  #
  # ولماذا `fail-fast` لا ينطبقُ وسلسلةٌ واحدةٌ لا مصفوفةٌ: لأنّ المقصودَ
  # **التراكمُ** نفسُه — كلُّ خدمةٍ تتركُ جداولَها في القاعدةِ لمن بعدَها.
  # وتوزيعُها على عدّاءَينِ يُبطِلُ ما تقيسُه.
  #
  # والترتيبُ **هو ترتيبُ `db-integration` حرفاً** ولا يُعادُ رصفُه ليُسعِفَ
  # مجموعةً: المطابقةُ سادسةً، فتسبقُها خمسُ خدماتٍ — وهي الحالةُ التي رُصد
  # فيها الإخفاقُ 2026-08-30.
  #
  # ولا تُوقَفُ السلسلةُ عندَ أوّلِ إخفاقٍ: تُسجَّلُ كلُّ ساقٍ ثمّ تُطبَعُ
  # خلاصةٌ وتُردُّ 1 إن أخفقت واحدةٌ — فيُقرأُ **مَن** أخفقَ لا **أنّ** شيئاً أخفق.
  # ───────────────────────────────────────────────────────────────────
  db-integration-shared:
    name: db-integration-shared
    runs-on: ubuntu-24.04
    container: node:20-alpine
    services:
      postgres:
        image: postgres:17  # CLM-0414: production (Supabase) is PostgreSQL 17 — CI measures the same major
        env:
          POSTGRES_DB: wasla_shared_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: git داخل alpine (لا يأتي مع الصورة)
        # المعالجةُ الجذريّةُ لـ`M0-22E`: محاولةٌ واحدةٌ تجعلُ الوظيفةَ رهينةَ ومضةِ
        # شبكةٍ واحدةٍ — وقد أخفقت فعلاً في التشغيلِ `33929916295` (وظيفةٌ واحدةٌ من
        # سبعٍ وعشرينَ، ماتت عندَ هذه الخطوةِ قبلَ `checkout`). فالإعادةُ **مُعلَنةٌ
        # لا صامتةٌ**: ثلاثُ محاولاتٍ بتراجعٍ 5s ثمّ 15s، وكلُّ محاولةٍ تُطبَعُ باسمِها
        # فتبقى الهشاشةُ **مرئيّةً في السجلِّ**، **والإخفاقُ بعدَ الثالثةِ يبقى
        # إخفاقاً** — فلا عيبٌ حقيقيٌّ يُخفى خلفَ إعادةٍ. والصَّدَفةُ `sh` لا `bash`
        # لأنّ `bash` نفسَه لم يُثبَّت بعدُ في هذه اللحظةِ.
        run: |
          set -eu
          for attempt in 1 2 3; do
            echo "apk add: محاولة ${attempt}/3"
            if apk add --no-cache git bash; then
              echo "apk add: نجحت في المحاولة ${attempt}"
              exit 0
            fi
            if [ "${attempt}" = 3 ]; then
              break
            fi
            delay=$(( attempt * 10 - 5 ))
            echo "apk add: أخفقت — انتظار ${delay}s ثم إعادة"
            sleep "${delay}"
          done
          echo "apk add: أخفقت ثلاث محاولات متتالية — الإخفاق يبقى إخفاقاً" >&2
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: تفعيل pnpm المثبَّت
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          echo "node   $(node --version)"
          echo "pnpm   $(pnpm --version)"
      - name: install
        run: pnpm install --frozen-lockfile
      - name: اثنتا عشرةَ مجموعةً تِباعاً على قاعدةٍ واحدةٍ
        env:
          DATABASE_URL: postgres://postgres:postgres@postgres:5432/wasla_shared_test
        run: bash scripts/ci/run-shared-db-integration.sh

  exit-gate-e2e:
    name: exit-gate-e2e
    runs-on: ubuntu-24.04
    container: node:20-alpine
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: channel
            pkg: "@wasla/channel-e2e"
            db: wasla_channel_e2e
            var: DATABASE_URL
          - leg: customer
            pkg: "@wasla/customer-e2e"
            db: wasla_customer_e2e
            var: CUSTOMER_DATABASE_URL
          - leg: order
            pkg: "@wasla/order-e2e"
            db: wasla_order_e2e
            var: ORDER_DATABASE_URL
          - leg: dispatch
            pkg: "@wasla/dispatch-e2e"
            db: wasla_dispatch_e2e
            var: DISPATCH_DATABASE_URL
          - leg: driver
            pkg: "@wasla/driver-e2e"
            db: wasla_driver_e2e
            var: DRIVER_DATABASE_URL
          - leg: negotiation
            pkg: "@wasla/negotiation-e2e"
            db: wasla_negotiation_e2e
            var: NEGOTIATION_DATABASE_URL
          - leg: subscription
            pkg: "@wasla/subscription-e2e"
            db: wasla_subscription_e2e
            var: DATABASE_URL
          - leg: marketplace
            pkg: "@wasla/marketplace-e2e"
            db: wasla_marketplace_e2e
            var: DATABASE_URL
          # `M5-12` · بوّابةُ خروجِ الطورِ 12 — صلةٌ وحملٌ.
          # **وهذهِ السّاقُ هي ما يجعلُ البوّابةَ بوّابةً**: الحزمةُ تتخطّى نفسَها بلا وصلٍ،
          # فما لم يُدَرْ هنا بقاعدةٍ حيّةٍ فليس مقيساً أصلاً (وانظرْ `EXIT_GATE_REQUIRE_DB` أدناه).
          - leg: search
            pkg: "@wasla/search-e2e"
            db: wasla_search_e2e
            var: DATABASE_URL
          # `M5-13` · بوّابةُ خروجِ الطورِ 13 — **الوحيدةُ التي ترفعُ خدمتَينِ حقيقيَّتَينِ**:
          # السوقُ يُنشرُ منتجاً ويكتبُ حدثَ مخزونٍ، والتوصيلُ يأخذُ اللقطةَ عبرَ HTTP
          # حقيقيٍّ ويقطعُ `placed → confirmed` بمرآةِ دفعٍ ثمَّ تأكيدٍ. وما دونَ سلكٍ
          # حقيقيٍّ لا يُقاسُ: أوّلُ تشغيلٍ لها كشفَ قيدَ قاعدةٍ ناقصاً و500 على جسمٍ
          # فارغٍ — عطبانِ مرَّا من 209 اختبارِ وحدةٍ و48 اختبارَ تكاملٍ.
          - leg: delivery
            pkg: "@wasla/delivery-e2e"
            db: wasla_delivery_e2e
            var: DATABASE_URL
          # `M5-14` · بوّابةُ خروجِ الطورِ 14 — عزلُ المستأجِرِ وإثباتُ SLA.
          - leg: partners
            pkg: "@wasla/partners-e2e"
            db: wasla_partners_e2e
            var: DATABASE_URL
          # `M5-17Q` · حدثُ اكتمالٍ حقيقيٌّ من حدِّ التوصيلِ → فاتورةٌ + تسويةٌ مرّةً واحدةً.
          - leg: billing
            pkg: "@wasla/billing-e2e"
            db: wasla_billing_e2e
            var: DATABASE_URL
    services:
      postgres:
        image: postgres:17  # CLM-0414: production (Supabase) is PostgreSQL 17 — CI measures the same major
        env:
          POSTGRES_DB: ${{ matrix.db }}
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: git داخل alpine (لا يأتي مع الصورة)
        # المعالجةُ الجذريّةُ لـ`M0-22E`: محاولةٌ واحدةٌ تجعلُ الوظيفةَ رهينةَ ومضةِ
        # شبكةٍ واحدةٍ — وقد أخفقت فعلاً في التشغيلِ `33929916295` (وظيفةٌ واحدةٌ من
        # سبعٍ وعشرينَ، ماتت عندَ هذه الخطوةِ قبلَ `checkout`). فالإعادةُ **مُعلَنةٌ
        # لا صامتةٌ**: ثلاثُ محاولاتٍ بتراجعٍ 5s ثمّ 15s، وكلُّ محاولةٍ تُطبَعُ باسمِها
        # فتبقى الهشاشةُ **مرئيّةً في السجلِّ**، **والإخفاقُ بعدَ الثالثةِ يبقى
        # إخفاقاً** — فلا عيبٌ حقيقيٌّ يُخفى خلفَ إعادةٍ. والصَّدَفةُ `sh` لا `bash`
        # لأنّ `bash` نفسَه لم يُثبَّت بعدُ في هذه اللحظةِ.
        run: |
          set -eu
          for attempt in 1 2 3; do
            echo "apk add: محاولة ${attempt}/3"
            if apk add --no-cache git bash; then
              echo "apk add: نجحت في المحاولة ${attempt}"
              exit 0
            fi
            if [ "${attempt}" = 3 ]; then
              break
            fi
            delay=$(( attempt * 10 - 5 ))
            echo "apk add: أخفقت — انتظار ${delay}s ثم إعادة"
            sleep "${delay}"
          done
          echo "apk add: أخفقت ثلاث محاولات متتالية — الإخفاق يبقى إخفاقاً" >&2
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: تفعيل pnpm المثبَّت
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
      - name: install
        run: pnpm install --frozen-lockfile
      - name: "اسمُ متغيّرِ الوصلِ يختلفُ بينَ البوّاباتِ بقصدٍ (لا يُوحَّد)"
        run: echo "${{ matrix.var }}=postgres://postgres:postgres@postgres:5432/${{ matrix.db }}" >> "$GITHUB_ENV"
      - name: "${{ matrix.leg }} · exit gate"
        # `EXIT_GATE_REQUIRE_DB=1`: داخلَ هذهِ الوظيفةِ **التخطّي إخفاقٌ**. وبلا هذا يكفي
        # خطأٌ في اسمِ متغيّرِ الوصلِ لتُخرِجَ `vitest` صفراً وتُعلَنَ الوظيفةُ خضراءَ
        # **ولم تُدَرْ حالةٌ واحدةٌ** (`RISK-0022`). وتُعلَنُ للسُّوقِ كلِّها عمداً: حزمةٌ لا
        # تقرأُ المتغيّرَ تتجاهلُهُ، ومن يقرأُهُ يرثُ الحراسةَ بلا سطرٍ جديدٍ هنا.
        env:
          EXIT_GATE_REQUIRE_DB: "1"
        run: pnpm --filter ${{ matrix.pkg }} test
      # ───────────────────────────────────────────────────────────────
      # `M1-02` — بابُ **منعِ الإعادةِ** كان حكمُه `⚠️ مُستدَلًّا عليه`: وظيفةُ
      # الساقِ نجحت بحاويةِ Postgres حيّةٍ، **لكنّ عدَّ حالاتِها لم يُقرأْ** لأنّ
      # تنزيلَ السجلِّ الخامِّ محجوبٌ عن بيئةِ التنفيذِ. والاستدلالُ من نجاحِ
      # وظيفةٍ كاملةٍ على حالةٍ بعينِها **استنتاجٌ لا قياسٌ**.
      #
      # فهذه الخطوةُ تجعلَ الحالةَ الواحدةَ **فحصاً مستقلَّ النتيجةِ**: اسمُها
      # وحكمُها يظهرانِ في `jobs` JSON — وهو **مقروءٌ** — فيصيرُ الدليلُ
      # مباشراً لا مُستنتَجاً.
      #
      # والحارسُ بعدَها ليس زينةً: بلا `DATABASE_URL` يتخطّى `describe.skipIf`
      # المجموعةَ **بلا ضجيجٍ** وتخرجُ `vitest` بصفرٍ — أي **خضرةٌ صامتةٌ**
      # كالتي كشفها `RISK-0022`. فيُشترَطُ صراحةً **حالةٌ واحدةٌ ناجحةٌ**،
      # ويُخفِقُ الفحصُ إن لم تُقَسْ.
      #
      # وقد **أخفقَ هذا الحارسُ في أوّلِ تشغيلٍ له** ([`33941548542`](https://github.com/skyosv10-art/wasla/actions/runs/33941548542)):
      # كُتِبَ المُرشِّحُ أوّلاً بنصٍّ لا يُطابِقُ اسمَ الحالةِ — فالاسمُ يبدأُ
      # بـ`**إعادةُ**` بنجمتَينِ، فلم يُطابِقْ شيءٌ وقِيسَ صفرٌ. **فمنعَ الحارسُ
      # خضرةً كاذبةً كان سيُبنى عليها حكمُ بوّابةٍ** — وهو أوّلُ دليلٍ على أنّه يعمل.
      # ولذلك يُرشَّحُ الآنَ بجزءٍ **مخصوصٍ بساقِ Postgres** لا يشترِكُ فيه
      # مُنفِّذُ الذاكرةِ.
      # ───────────────────────────────────────────────────────────────
      - name: "M1-02 · التشغيلُ المخصوصُ لحالةِ منعِ الإعادةِ"
        if: matrix.leg == 'channel'
        # ولا `continue-on-error` هنا: كُتِبَ أوّلاً ليُبقيَ الخطواتِ التشخيصيّةَ
        # تعملُ بعدَ إخفاقِ التشغيلِ، **فرفضَه `validate-ci-mandatory.sh`** بوصفِه
        # تقنيعاً لوظيفةٍ (البابُ 3 · [`VERIFY_COMMAND.md`](../../docs/00-rules/VERIFY_COMMAND.md) §4).
        # **والحارسُ أصابَ ولا يُعطَّلُ ولا يُستثنى**: راحةُ التشخيصِ لا تُشترى
        # بإضعافِ مانعٍ. فحُذِفَ، وإخفاقُ التشغيلِ يُخفِقُ الوظيفةَ كما يجب.
        # `NO_COLOR` ليس تجميلاً: `vitest` يُلوِّنُ مخرجاتِه في GitHub Actions،
        # فتتخلَّلُ رموزُ ANSI سطرَ الحصيلةِ ويصيرُ `1 passed` غيرَ متجاورٍ —
        # **فيُخفِقُ الحارسُ على نصٍّ لا على حقيقةٍ**. وقد وقعَ ذلك فعلاً في
        # التشغيلِ `33942659160`: التشغيلُ نجحَ والمجموعةُ لم تُتخطَّ ومتغيّرُ
        # الوصلِ مُصدَّرٌ، **والحارسُ وحدَه أخفقَ**. ولذلك يُنزَعُ اللونُ من
        # المصدرِ **وتُنظَّفُ رموزُ ANSI قبلَ المطابقةِ** — حزاماً وحمّالةً.
        env:
          NO_COLOR: "1"
          FORCE_COLOR: "0"
        run: |
          set -o pipefail
          pnpm --filter ${{ matrix.pkg }} exec vitest run \
            src/__tests__/m1-02-session-gate.e2e.test.ts \
            -t 'تُرفَض بقيدِ المحرّك' \
            --reporter=verbose 2>&1 | sed -r 's/\x1b\[[0-9;]*[A-Za-z]//g' | tee m1-02-replay.log
      # الخطواتُ الثلاثُ التاليةُ **أدواتُ قياسٍ لا زينةٌ**: سجلُّ الوظيفةِ الخامُّ
      # غيرُ قابلٍ للتنزيلِ في بيئةِ التنفيذِ، **وحكمُ كلِّ خطوةٍ مقروءٌ في
      # `jobs` JSON**. فكلُّ سؤالٍ تشخيصيٍّ يُجعَلُ خطوةً مستقلّةً ليُقرأَ جوابُه
      # من الخارجِ — **والتشخيصُ يُبنى ولا يُخمَّنُ**.
      - name: "تشخيصٌ · متغيّرُ الوصلِ مُصدَّرٌ إلى الخطوةِ"
        if: matrix.leg == 'channel'
        run: test -n "${DATABASE_URL:-}"
      - name: "تشخيصٌ · مجموعةُ Postgres لم تُتخطَّ"
        if: matrix.leg == 'channel'
        run: |
          if grep -qE 'Test Files +1 skipped' m1-02-replay.log; then
            echo "المجموعةُ تُخطَّت بالكاملِ — لم تُقَسْ" >&2
            exit 1
          fi
      - name: "M1-02 · حالةٌ واحدةٌ ناجحةٌ وإلّا فلا قياسَ"
        if: matrix.leg == 'channel'
        run: |
          if ! grep -qE 'Tests +1 passed' m1-02-replay.log; then
            echo "M1-02: حالةُ منعِ الإعادةِ لم تُقَسْ — لا تُقبَلُ خضرةٌ صامتةٌ" >&2
            exit 1
          fi
          echo "M1-02: حالةُ منعِ الإعادةِ قِيست ونجحت على Postgres حقيقيٍّ"

  # ───────────────────────────────────────────────────────────────────
  # M3-01 — customer-mini-app-e2e: Playwright E2E + accessibility gate.
  #
  # يُشغِّلُ اختباراتِ Playwright ضدَّ حزمةِ الإنتاجِ المبنيةِ (vite build +
  # vite preview). يُحاكي الـ API على مستوى route layer — لا اعتمادَ على
  # خادمٍ خلفيٍّ. يتضمّنُ فحصَ axe-core لـ WCAG 2.0 A/AA.
  #
  # ADR-044: Playwright لم يعد مؤجَّلاً بعد CLM-0289.
  # ───────────────────────────────────────────────────────────────────
  customer-mini-app-e2e:
    name: customer-mini-app-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.20.1"
      - name: تفعيل pnpm المثبَّت
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
      - name: install
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/customer-mini-app
      - name: Run E2E + accessibility tests
        run: pnpm --filter @wasla/customer-mini-app exec playwright test
      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-mini-app-e2e-report
          path: apps/customer-mini-app/playwright-report/
          retention-days: 30
          if-no-files-found: warn


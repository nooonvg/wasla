openapi: 3.1.0
info:
  title: WASLA Marketplace Search API
  version: 1.0.0
  description: |
    عقد واجهة خدمة البحث في السوق (Phase 12).

    - الفهرسُ نموذجُ قراءةٍ مشتقٌّ من أحداثِ السوقِ، لا قراءةٌ مباشرةٌ من جداولِ السوقِ (ADR-025).
    - الظهورُ مُشتقٌّ من الحالةِ المُستهلكةِ: متجرٌ approved · منتجٌ published · اعتدالٌ approved · كميّةٌ > 0 (ADR-016 القرارُ 3). لا عمودَ is_visible.
    - البحثُ ثنائيُّ اللغةِ (ar/en). الترتيبُ مفسَّرٌ: exact > prefix > fts > trigram.
    - البحثُ ليس بوّابةَ معاملةٍ: لا حجزَ ولا دفعَ. اتساقٌ ناعمٌ (eventual) مقبولٌ.
    - `total` عددُ المطابقاتِ **كلِّها** (يُحسَبُ في القاعدةِ قبلَ التحديدِ)، لا عددُ ما التُقِطَ للترتيبِ.
    - عمقُ الترقيمِ محدودٌ بنافذةِ ترتيبٍ (5000 نتيجةً): صفحةٌ تتجاوزُها تُرَدُّ 400 لا تُخدَمُ مقصوصةً.
    - `/search/health` حياةٌ (لا تبعيّةَ) · `/search/ready` جاهزيّةٌ (تسألُ الفهرسَ).
  contact:
    name: WASLA
servers:
  - url: http://localhost:8012
    description: Local development

tags:
  - name: search
    description: البحث في المنتجات والمتاجر

paths:
  /search/products:
    get:
      tags: [search]
      summary: البحث في المنتجات
      operationId: searchProducts
      security:
        - ServiceAuth: ['search:products:read']
      parameters:
        - name: q
          in: query
          required: true
          description: نص البحث الحر (عربي/إنجليز). يُطبَّع ويُجزَّأ قبل التنفيذ.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - $ref: '#/components/parameters/Locale'
        - name: category_slug
          in: query
          required: false
          description: مقطعُ التصنيفِ للترشيحِ. من أصلِ السوقِ لا يُخترَع هنا.
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: sort
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/SearchSort'
      responses:
        '200':
          description: صفحة نتائج البحث
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthUnauthorized' }
        '403': { $ref: '#/components/responses/AuthForbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /search/stores:
    get:
      tags: [search]
      summary: البحث عن المتاجر بالاسم (G-S9.7 · ADR-025 §6)
      operationId: searchStores
      description: |
        نموذجُ قراءةٍ مشتقٌّ (`search_store_index`) — marketplace مصدرُ الحقيقةِ، ولا `?q=` في
        مساراتِه (ADR-016 §9). يظهرُ المتجرُ **إن وفقط إن** كانَ `approved` وله منتجٌ واحدٌ على
        الأقلِّ يحقّقُ `isProductVisible` (منشورٌ · اعتدالُه معتمَدٌ · مخزونُه > 0)؛ تُشتقُّ الأهليّةُ عندَ
        القراءةِ ولا رايةَ مخزَّنةً. المطابقةُ على أسماءِ ar/en/ur كلِّها بعدَ تطبيعٍ معلَنٍ،
        و`%` و`_` و`\` حرفيّةٌ. الترتيبُ حتميٌّ: تامٌّ ثم بادئةٌ ثم احتواءٌ، ثم `store_slug` تصاعديًّا.
        أيُّ معاملٍ غيرِ المعلَنةِ يُرفَضُ (`SEARCH_UNKNOWN_PARAMETER`).
      security:
        - ServiceAuth: ['search:stores:read']
      parameters:
        - name: q
          in: query
          required: true
          description: اسمُ المتجرِ أو جزؤُه — 1..200 محرفٍ بعدَ القصِّ، وغيرُ فارغٍ بعدَ التطبيعِ (حدودُ `/search/products` نفسُها · CLM-0652 · ADR-025 §6.8).
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: locale
          in: query
          required: false
          description: لغةُ `title` في الجوابِ؛ الرجوعُ إلى العربيّةِ إن غابَ الاسمُ بها. الافتراضيُّ ar.
          schema: { $ref: '#/components/schemas/StoreSearchLocale' }
        - name: page
          in: query
          required: false
          description: عددٌ صحيحٌ ≥ 1 بلا حدٍّ أعلى (CLM-0652). صفحةٌ بعدَ آخرِ نتيجةٍ تُرجِعُ `items` فارغةً و`total` الصادقَ.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: صفحةُ متاجرَ — ثلاثةُ حقولٍ عامّةٍ لكلِّ متجرٍ فقط
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoreSearchPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthUnauthorized' }
        '403': { $ref: '#/components/responses/AuthForbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /search/health:
    get:
      tags: [search]
      summary: نبضةُ حياةٍ (liveness) — لا تسألُ الفهرسَ
      description: |
        تُجيبُ ما دامت العمليّةُ حيّةً، بلا تبعيّةٍ. **ليست بوّابةَ توجيهٍ**: نسخةٌ فقدت
        نموذجَ قراءتِها تبقى `ok` هنا ولا تُعادُ تشغيلاً — التوجيهُ يُقرَّرُ من
        `/search/ready`.
      operationId: health
      responses:
        '200':
          description: العمليّةُ حيّةٌ
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }

  /search/ready:
    get:
      tags: [search]
      summary: مسبارُ جاهزيّةٍ (readiness) — يسألُ الفهرسَ
      description: |
        يلمسُ نموذجَ القراءةِ فعلاً. `200` إن أجابَ الفهرسُ، و`503 SEARCH_INDEX_DEGRADED`
        إن لم يُجِبْ أو إن لم يُركَّبْ مسبارٌ (لا جاهزيّةَ افتراضاً بلا إثباتٍ).
        **فهرسٌ فارغٌ جاهزٌ** (`indexed_documents: 0`) — نشرٌ باردٌ قبلَ أوّلِ تشغيلٍ
        للناقلِ لا يجوزُ أن يَقفِلَ على نفسِه. والمسبارُ يقيسُ **الوصولَ لا الحداثةَ**.
      operationId: ready
      security:
        - ServiceAuth: ['search:ready:read']
      responses:
        '200':
          description: الخدمةُ قادرةٌ على خدمةِ بحثٍ
          content:
            application/json:
              schema:
                type: object
                required: [status, index_reachable, indexed_documents]
                properties:
                  status: { type: string, const: ready }
                  index_reachable: { type: boolean, const: true }
                  indexed_documents:
                    type: integer
                    minimum: 0
                    description: عددُ الوثائقِ في عيّنةٍ محدودةٍ (لا عدٌّ كاملٌ — المسبارُ يجري كلَّ نبضةٍ).
        '401': { $ref: '#/components/responses/AuthUnauthorized' }
        '403': { $ref: '#/components/responses/AuthForbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

components:
  securitySchemes:
    ServiceAuth:
      type: apiKey
      in: header
      name: x-wasla-service-auth
      description: |
        توقيعُ هويّةِ الخدمةِ الصادرُ عن `packages/service-auth`. كلُّ عمليّةٍ في
        هذا العقدِ تحملُ `security:` بصلاحيّةِ مسارِها — ما خلا `/search/health` المفتوحَ
        بقرارٍ مكتوبٍ — فلا يُقبَلُ نداءٌ بلا ترويسةٍ صحيحةٍ
        ([ADR-020](../../../docs/15-decisions/ADR-020-service-to-service-identity.md) ·
        [ADR-021](../../../docs/15-decisions/ADR-021-service-token-replay-policy.md)).
        والبحثُ خدمةٌ داخليّةٌ بلا مُنتَفِعَ إنسانٍ، فلا مسارَ فيهِ يَمُسُّ مَورِداً
        مملوكاً ولا يطلبُ ربطَ مستفيدٍ.
  parameters:
    Locale:
      name: locale
      in: query
      required: false
      description: اللغة المطلوبة للنتائج. الافتراضي ar.
      schema: { $ref: '#/components/schemas/Locale' }
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20

  schemas:
    Locale:
      type: string
      enum: [ar, en]
      description: اللغة المدعومة. ar = الافتراضي (fallback).

    SearchSort:
      type: string
      enum: [relevance, price_asc, price_desc, newest]
      default: relevance

    ProductSearchResult:
      type: object
      required: [product_id, store_id, store_slug, sku, title_ar, price_minor_units, currency_code, category_slug, score]
      properties:
        product_id: { type: string, format: uuid }
        store_id: { type: string, format: uuid }
        store_slug: { type: string }
        sku: { type: string, description: رقمُ المنتجِ الواحدُ داخلَ متجرٍه. }
        title_ar: { type: string }
        title_en: { type: string, nullable: true }
        price_minor_units:
          type: integer
          minimum: 0
          description: سعرٌ بأصغرِ وحدةٍ (هللة). بيانُ كتالوجٍ لا معاملة (ADR-016 قرار 4).
        currency_code: { type: string, const: SAR }
        category_slug: { type: string, description: مقطعُ التصنيفِ من السوقِ. }
        score:
          type: number
          minimum: 0
          maximum: 1
          description: درجةُ المطابقةِ المفسَّرةُ (0..1). exact > prefix > fts > trigram.

    SearchPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ProductSearchResult' }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 50 }
        total: { type: integer, minimum: 0 }

    StoreSearchLocale:
      type: string
      enum: [ar, en, ur]
      default: ar
      description: لغاتُ اسمِ المتجرِ الثلاثُ في marketplace؛ ar الافتراضيُّ والرجوعُ.

    StoreSearchResult:
      type: object
      additionalProperties: false
      required: [store_slug, title, category_slug]
      description: الإسقاطُ العامُّ وحدَه — لا owner_public_id ولا حالةٌ ولا مراجعاتٌ ولا طاقمٌ ولا توقيتاتٌ.
      properties:
        store_slug: { type: string }
        title: { type: string, description: الاسمُ بلغةِ locale أو العربيّةِ إن غابَ. }
        category_slug: { type: string, description: مقطعُ تصنيفِ المتجرِ من السوقِ. }

    StoreSearchPage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/StoreSearchResult' }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 50 }
        total: { type: integer, minimum: 0 }

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code: { type: string, description: كود ثابت (stable) }
        message: { type: string }
        trace_id: { type: string }

  responses:
    AuthUnauthorized:
      description: لا ترويسة هويّة خدمة أو ترويسة غير صالحة
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    AuthForbidden:
      description: الرمز صحيح لكنه يفتقد الصلاحيّة المطلوبة
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationError:
      description: مدخلات غير صالحة
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ServiceUnavailable:
      description: الخدمة في وضع متدهور (degraded mode)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

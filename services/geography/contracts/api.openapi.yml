openapi: 3.1.0
info:
  title: WASLA Geography & Localization API
  version: 1.0.0
  description: |
    عقد واجهة خدمة Geography & Localization (Phase 02).

    - التسلسل الهرمي: Country → Region → City → District → Zone.
    - كل مستوى يُرجَع بالاسم المترجم حسب `locale` (ar/en/ur). ar = fallback افتراضي.
    - موقع المستخدم يُخزَّن بمرجع `wasla_public_id` (opaque) — لا FK إلى Identity.
    - تغيير الموقع لا يُنشئ هوية جديدة (Identity مستقر) — يُسجَّل في history + outbox.
  contact:
    name: WASLA
servers:
  - url: http://localhost:8081
    description: Local development

tags:
  - name: geography
    description: التسلسل الهرمي الجغرافي
  - name: user-location
    description: موقع المستخدم

paths:
  /geo/countries:
    get:
      tags: [geography]
      summary: قائمة البلدان
      operationId: listCountries
      security:
        - ServiceAuth:
            - geography:hierarchy:read
      parameters:
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: قائمة البلدان بالاسم المترجم
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Country'}
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '400': {$ref: '#/components/responses/ValidationError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /geo/countries/{countryId}/regions:
    get:
      tags: [geography]
      summary: مناطق/إمارات بلد
      operationId: listRegions
      security:
        - ServiceAuth:
            - geography:hierarchy:read
      parameters:
        - $ref: '#/components/parameters/CountryId'
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: قائمة المناطق
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Region'}
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /geo/regions/{regionId}/cities:
    get:
      tags: [geography]
      summary: مدن منطقة
      operationId: listCities
      security:
        - ServiceAuth:
            - geography:hierarchy:read
      parameters:
        - $ref: '#/components/parameters/RegionId'
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: قائمة المدن
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/City'}
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /geo/cities/{cityId}/districts:
    get:
      tags: [geography]
      summary: أحياء مدينة
      operationId: listDistricts
      security:
        - ServiceAuth:
            - geography:hierarchy:read
      parameters:
        - $ref: '#/components/parameters/CityId'
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: قائمة الأحياء
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/District'}
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /geo/districts/{districtId}/zones:
    get:
      tags: [geography]
      summary: مناطق فرعية لحي
      operationId: listZones
      security:
        - ServiceAuth:
            - geography:hierarchy:read
      parameters:
        - $ref: '#/components/parameters/DistrictId'
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: قائمة المناطق الفرعية
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Zone'}
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /geo/zones/search:
    get:
      tags: [geography]
      summary: البحث عن منطقة فرعية صالحة بالاسم (G-S9.3 · CLM-0645)
      description: |
        يُرجع **المناطق الفرعية النشطة فقط** (`status = active`) التي يحوي أحدُ أسمائها
        المترجمة (ar/en/ur) نصَّ `q` — مطابقةٌ جزئيّةٌ لا تتأثّر بحالة الأحرف. هذا هو
        معيارُ الصلاحية نفسُه الذي تطبّقه خدمة العملاء على `zone_id` في الطلب
        (`requireActiveZone` · منطقة غير نشطة تُرفض)، فلا يُعرض للاختيار ما سيُرفض.
        الترتيب حتمي: `code` ثم `id`. الاسم المُرجع مُترجم بـ`locale` مع fallback إلى `ar`
        (ADR-006). لا تطبيع للتشكيل أو الهمزات في هذا الإصدار. الرمزان `%` و`_` والشرطة المائلة العكسية
        في `q` تُعامَل حرفيًّا (تُهرَّب قبل المطابقة).
      operationId: searchZones
      security:
        - ServiceAuth:
            - geography:zone:read
      parameters:
        - name: q
          in: query
          required: true
          description: نص البحث بعد قصّ المسافات الطرفية — من 2 إلى 64 حرفًا.
          schema: {type: string, minLength: 2, maxLength: 64}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 20, default: 10}
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: المناطق النشطة المطابقة مع مسار الهرم (قد تكون فارغة)
          content:
            application/json:
              schema:
                type: array
                maxItems: 20
                items: {$ref: '#/components/schemas/ZoneDetail'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /geo/zones/{zoneId}:
    get:
      tags: [geography]
      summary: تفاصيل منطقة فرعية (مع المسار الكامل للوالدين)
      operationId: getZone
      security:
        - ServiceAuth:
            - geography:zone:read
      parameters:
        - $ref: '#/components/parameters/ZoneId'
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: المنطقة الفرعية مع مسار الهرم
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ZoneDetail'}
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /geo/users/{waslaPublicId}/location:
    get:
      tags: [user-location]
      summary: الموقع الحالي للمستخدم
      operationId: getUserLocation
      security:
        - ServiceAuth:
            - geography:location:read
      parameters:
        - $ref: '#/components/parameters/WaslaPublicId'
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: الموقع الحالي للمستخدم
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserLocation'}
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    put:
      tags: [user-location]
      summary: تعيين/تحديث موقع المستخدم
      operationId: setUserLocation
      security:
        - ServiceAuth:
            - geography:location:write
      parameters:
        - $ref: '#/components/parameters/WaslaPublicId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetUserLocationRequest'}
      responses:
        '200':
          description: تم تحديث الموقع (تغيير)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserLocation'}
        '201':
          description: تم تعيين الموقع لأول مرة
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserLocation'}
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '400': {$ref: '#/components/responses/ValidationError'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /geo/users/{waslaPublicId}/location/history:
    get:
      tags: [user-location]
      summary: سجل تغييرات موقع المستخدم
      operationId: getUserLocationHistory
      security:
        - ServiceAuth:
            - geography:location:read
      parameters:
        - $ref: '#/components/parameters/WaslaPublicId'
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: سجل تغييرات الموقع
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/UserLocationHistoryEntry'}
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

components:
  securitySchemes:
    ServiceAuth:
      type: apiKey
      in: header
      name: x-wasla-service-auth
      description: توقيعُ هويّةِ الخدمةِ الصادرُ عن `packages/service-auth`. كلُّ عمليّةٍ في هذا العقدِ تحملُ `security:` بصلاحيّةِ مسارِها — ما خلا العمليّاتِ المفتوحةَ بقرارٍ مكتوبٍ (مثلُ `/health`) — فلا يُقبَلُ نداءٌ بلا ترويسةٍ صحيحةٍ ([ADR-020](../../../docs/15-decisions/ADR-020-service-to-service-identity.md) · [ADR-021](../../../docs/15-decisions/ADR-021-service-token-replay-policy.md)).
  parameters:
    Locale:
      name: locale
      in: query
      required: false
      description: اللغة المطلوبة للاسم (ar=en=ur). الافتراضي ar.
      schema:
        $ref: '#/components/schemas/Locale'
    CountryId:
      name: countryId
      in: path
      required: true
      schema: {type: string, format: uuid}
    RegionId:
      name: regionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    CityId:
      name: cityId
      in: path
      required: true
      schema: {type: string, format: uuid}
    DistrictId:
      name: districtId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ZoneId:
      name: zoneId
      in: path
      required: true
      schema: {type: string, format: uuid}
    WaslaPublicId:
      name: waslaPublicId
      in: path
      required: true
      schema: {type: string, pattern: '^WS-[0-9]{10}$'}

  schemas:
    Locale:
      type: string
      enum: [ar, en, ur]
      description: اللغة المدعومة. ar = اللغة الافتراضية/الأساسية (fallback).

    GeoStatus:
      type: string
      enum: [active, inactive]

    LocalizedName:
      type: object
      required: [ar]
      properties:
        ar: {type: string}
        en: {type: string, nullable: true}
        ur: {type: string, nullable: true}
      description: الاسم بكل اللغات. ar إلزامي (fallback).

    Country:
      type: object
      required: [id, code, status, name]
      properties:
        id: {type: string, format: uuid}
        code: {type: string, description: 'ISO 3166-1 alpha-2 (مثال: SA)'}
        iso3: {type: string, description: 'ISO 3166-1 alpha-3 (مثال: SAU)'}
        status: {$ref: '#/components/schemas/GeoStatus'}
        name: {type: string, description: 'الاسم بالـlocale المطلوب'}

    Region:
      type: object
      required: [id, country_id, code, status, name]
      properties:
        id: {type: string, format: uuid}
        country_id: {type: string, format: uuid}
        code: {type: string}
        status: {$ref: '#/components/schemas/GeoStatus'}
        name: {type: string}

    City:
      type: object
      required: [id, region_id, code, status, name]
      properties:
        id: {type: string, format: uuid}
        region_id: {type: string, format: uuid}
        code: {type: string}
        status: {$ref: '#/components/schemas/GeoStatus'}
        name: {type: string}

    District:
      type: object
      required: [id, city_id, code, status, name]
      properties:
        id: {type: string, format: uuid}
        city_id: {type: string, format: uuid}
        code: {type: string}
        status: {$ref: '#/components/schemas/GeoStatus'}
        name: {type: string}

    Zone:
      type: object
      required: [id, district_id, code, status, name]
      properties:
        id: {type: string, format: uuid}
        district_id: {type: string, format: uuid}
        code: {type: string}
        status: {$ref: '#/components/schemas/GeoStatus'}
        name: {type: string}

    ZoneDetail:
      type: object
      description: المنطقة مع مسار الهرم الكامل والاسم المترجم
      required: [id, code, status, name, path]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        status: {$ref: '#/components/schemas/GeoStatus'}
        name: {type: string}
        path:
          type: object
          required: [country, region, city, district]
          properties:
            country: {$ref: '#/components/schemas/Country'}
            region: {$ref: '#/components/schemas/Region'}
            city: {$ref: '#/components/schemas/City'}
            district: {$ref: '#/components/schemas/District'}

    UserLocation:
      type: object
      required: [wasla_public_id, zone, source, effective_at, version]
      properties:
        wasla_public_id: {type: string, pattern: '^WS-[0-9]{10}$'}
        zone: {$ref: '#/components/schemas/Zone'}
        source:
          type: string
          enum: [customer_bot, driver_bot, partner_bot, admin, system]
        effective_at: {type: string, format: date-time}
        version: {type: integer, description: 'optimistic concurrency'}

    SetUserLocationRequest:
      type: object
      required: [zone_id, source]
      properties:
        zone_id: {type: string, format: uuid}
        source:
          type: string
          enum: [customer_bot, driver_bot, partner_bot, admin, system]

    UserLocationHistoryEntry:
      type: object
      required: [old_zone, new_zone, changed_at, source]
      properties:
        old_zone:
          type: object
          nullable: true
          properties:
            id: {type: string, format: uuid}
            name: {type: string}
        new_zone:
          type: object
          required: [id, name]
          properties:
            id: {type: string, format: uuid}
            name: {type: string}
        changed_at: {type: string, format: date-time}
        source:
          type: string
          enum: [customer_bot, driver_bot, partner_bot, admin, system]

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code: {type: string, description: 'كود ثابت (stable)'}
        message: {type: string}
        trace_id: {type: string}

  responses:
    ValidationError:
      description: مدخلات غير صالحة
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    NotFound:
      description: الكيان غير موجود
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Conflict:
      description: تعارض حالة
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Unprocessable:
      description: مدخلات صالحة شكلياً لكن غير مقبولة منطقياً
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    ServiceUnavailable:
      description: الخدمة في وضع متدهور
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    AuthUnauthorized:
      description: طلبٌ بلا ترويسةِ هويّةِ خدمةٍ، أو بتوقيعٍ غيرِ صحيحٍ، أو برمزٍ منتهي الصلاحيّةِ أو مُستعمَلٍ ثانيةً. الردُّ لا يُفصِحُ عن السببِ الدقيقِ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AuthForbidden:
      description: هويّةُ خدمةٍ صحيحةٌ ولكنّ الصلاحيّةَ المطلوبةَ غيرُ ممنوحةٍ لهذهِ الخدمةِ، أو المُنتَفِعُ الموقَّعُ في الرمزِ لا يملكُ الموردَ المطلوبَ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

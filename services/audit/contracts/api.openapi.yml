openapi: 3.1.0
info:
  title: WASLA Audit Service API
  version: 0.1.0
  description: >
    سجل التدقيق — خدمة append-only لتسجيل الأحداث الإدارية.
    M3-04 ADMIN_MVP_SPEC §6.2.
servers:
  - url: http://localhost:8092
    description: Local development
tags:
  - name: audit
    description: عمليات سجل التدقيق
paths:
  /health:
    get:
      tags: [audit]
      summary: Health check
      security: []
      responses:
        '200':
          description: Service is healthy
  /audit/events:
    post:
      tags: [audit]
      summary: Append an audit event
      description: >
        يسجّل حدثاً في سجل التدقيق. السجل append-only: لا يمكن تعديل أو حذف الأحداث.
      security:
        - ServiceAuth: [audit:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAuditEvent'
      responses:
        '201':
          description: Event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEvent'
        '400':
          $ref: '#/components/responses/Error'
    get:
      tags: [audit]
      summary: List audit events with filtering
      description: >
        يعرض الأحداث مرتبة من الأحدث إلى الأقدم مع الفلترة.
      security:
        - ServiceAuth: [audit:read]
      parameters:
        - name: actor_id
          in: query
          schema: { type: string }
        - name: actor_role
          in: query
          schema: { type: string }
        - name: action
          in: query
          schema: { type: string }
        - name: resource_type
          in: query
          schema: { type: string }
        - name: resource_id
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        '200':
          description: List of audit events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventList'
        '400':
          $ref: '#/components/responses/Error'
    put:
      tags: [audit]
      summary: Rejected — the audit log is append-only (UAT-08)
      description: >
        محاولةُ تعديلٍ تُرفَضُ صراحةً بـ405 مع ترويسة Allow (ADR-072 D2). لا يُمسُّ أيُّ حدثٍ.
      security:
        - ServiceAuth: []
      responses:
        '401':
          $ref: '#/components/responses/Error'
        '405':
          $ref: '#/components/responses/MethodNotAllowedCollection'
    patch:
      tags: [audit]
      summary: Rejected — the audit log is append-only (UAT-08)
      security:
        - ServiceAuth: []
      responses:
        '401':
          $ref: '#/components/responses/Error'
        '405':
          $ref: '#/components/responses/MethodNotAllowedCollection'
    delete:
      tags: [audit]
      summary: Rejected — the audit log is append-only (UAT-08)
      security:
        - ServiceAuth: []
      responses:
        '401':
          $ref: '#/components/responses/Error'
        '405':
          $ref: '#/components/responses/MethodNotAllowedCollection'
  /audit/events/{id}:
    description: >
      لا طريقةَ مدعومةً على حدثٍ مفردٍ. GET يبقى 404 (لا قراءةَ بالمعرّف)؛ طرقُ التعديلِ
      PUT/PATCH/DELETE/POST تُرفَضُ 405 بترويسة Allow فارغةٍ (RFC 9110 §10.2.1).
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [audit]
      summary: Rejected — audit events cannot be modified (UAT-08)
      security:
        - ServiceAuth: []
      responses:
        '401':
          $ref: '#/components/responses/Error'
        '405':
          $ref: '#/components/responses/MethodNotAllowedItem'
    patch:
      tags: [audit]
      summary: Rejected — audit events cannot be modified (UAT-08)
      security:
        - ServiceAuth: []
      responses:
        '401':
          $ref: '#/components/responses/Error'
        '405':
          $ref: '#/components/responses/MethodNotAllowedItem'
    delete:
      tags: [audit]
      summary: Rejected — audit events cannot be modified (UAT-08)
      security:
        - ServiceAuth: []
      responses:
        '401':
          $ref: '#/components/responses/Error'
        '405':
          $ref: '#/components/responses/MethodNotAllowedItem'
    post:
      tags: [audit]
      summary: Rejected — audit events cannot be modified (UAT-08)
      security:
        - ServiceAuth: []
      responses:
        '401':
          $ref: '#/components/responses/Error'
        '405':
          $ref: '#/components/responses/MethodNotAllowedItem'
components:
  securitySchemes:
    ServiceAuth:
      type: apiKey
      in: header
      name: x-wasla-service-auth
      description: |
        توقيعُ هويّةِ الخدمةِ الصادرُ عن `packages/service-auth`.
  schemas:
    CreateAuditEvent:
      type: object
      required: [action, resource_type, resource_id]
      properties:
        action:
          type: string
        resource_type:
          type: string
        resource_id:
          type: string
        metadata:
          type: object
          default: {}
      description: |
        ADR-063 PO-002 (CLM-0477): `actor_id` and `actor_role` are no longer accepted in the request body.
        They are derived from the verified service token: `actor_id` from `obo` (on-behalf-of public id)
        or the calling service name; `actor_role` from the calling service name.
    AuditEvent:
      type: object
      properties:
        id:
          type: integer
        actor_id:
          type: string
        actor_role:
          type: string
        action:
          type: string
        resource_type:
          type: string
        resource_id:
          type: string
        metadata:
          type: object
        created_at:
          type: string
          format: date-time
    AuditEventList:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        limit:
          type: integer
        offset:
          type: integer
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
              message:
                type: string
              trace_id:
                type: string
    MethodNotAllowedCollection:
      description: Modification of the audit log is not allowed (ADR-072 D2)
      headers:
        Allow:
          description: The methods actually served on /audit/events.
          schema: { type: string, const: 'GET, HEAD, POST' }
      content:
        application/json:
          schema:
            type: object
            properties:
              code: { type: string, const: AUDIT_METHOD_NOT_ALLOWED }
              message: { type: string }
              trace_id: { type: string }
    MethodNotAllowedItem:
      description: Audit events cannot be modified (ADR-072 D2)
      headers:
        Allow:
          description: Empty — no method is served on a single event.
          schema: { type: string, const: '' }
      content:
        application/json:
          schema:
            type: object
            properties:
              code: { type: string, const: AUDIT_METHOD_NOT_ALLOWED }
              message: { type: string }
              trace_id: { type: string }

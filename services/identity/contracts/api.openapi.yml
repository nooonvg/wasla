openapi: 3.0.3
info:
  title: WASLA Identity Service API
  description: |
    عقد API لخدمة Identity — المرحلة Phase 01 (Identity Foundation).

    المبدأ الجوهري (وفق [ADR-001](../../../docs/15-decisions/ADR-001-identity-decoupled-from-telegram.md)):
    **Wasla User ID هو الهوية الداخلية الأساسية**. معرّفات Telegram وأرقام الهواتف
    هي روابط Identity (Identity Links) وليست مفتاح النظام النهائي.

    Exit Gate لـ Phase 01: إنشاء مستخدم من Telegram وبقاء هويته مستقرة عبر تغيير Username.
  version: 1.0.0
  contact:
    name: Team 01 — Identity & Auth
servers:
  - url: https://api.wasla.local/v1
    description: Environment-agnostic contract (host is configuration per environment)

# ─────────────────────────────────────────────────────────────────────
# إصدار العقد: v1. أي تغيير غير متوافق للخلف يتطلب إصدار v2 + ADR.
# ─────────────────────────────────────────────────────────────────────
tags:
  - name: Resolve
    description: حلّ/إنشاء هوية Wasla من معرّف خارجي (Telegram)
  - name: Users
    description: عمليات قراءة/تحديث مستخدم Wasla
  - name: IdentityLinks
    description: إدارة روابط الهوية الخارجية (Telegram/Phone/...)
  - name: Recovery
    description: استرجاع الحساب عبر Wasla Public ID
  - name: History
    description: سجل تغييرات الهوية (Username/روابط)
  - name: Assertions
    description: تأكيد المستخدم النهائي wua1 (ADR-060 · CLM-0440)
  - name: Sessions
    description: دورة حياة جلسة المستخدم — إصدار واستبدال وسحب (ADR-069 · CLM-0519 · المرحلة الأولى)

paths:
  /identity/resolve:
    post:
      tags: [Resolve]
      summary: حلّ أو إنشاء مستخدم Wasla من هوية Telegram
      description: |
        Idempotent حسب `telegram_user_id`. إذا كان المعرّف مرتبطاً بمستخدم موجود،
        يُرجَع ذلك المستخدم دون إنشاء جديد. تغيير `telegram_username` لا يُنشئ مستخدمًا جديدًا —
        يُسجَّل في Identity History بدل ذلك.
      operationId: resolveIdentity
      security:
        - ServiceAuth:
            - identity:resolve:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveIdentityRequest'
      responses:
        '200':
          description: مستخدم موجود تم حلّه
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveIdentityResponse'
        '201':
          description: مستخدم جديد أُنشئ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveIdentityResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /identity/users/{waslaPublicId}:
    get:
      tags: [Users]
      summary: قراءة مستخدم Wasla عبر Wasla Public ID
      operationId: getUser
      security:
        - ServiceAuth:
            - identity:user:read
      parameters:
        - $ref: '#/components/parameters/WaslaPublicId'
      responses:
        '200':
          description: المستخدم
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '404': {$ref: '#/components/responses/NotFound'}

  /identity/users/{waslaPublicId}/links:
    post:
      tags: [IdentityLinks]
      summary: إضافة رابط هوية خارجي للمستخدم (Phone/Telegram جديد/...)
      operationId: addIdentityLink
      security:
        - ServiceAuth:
            - identity:link:write
      parameters:
        - $ref: '#/components/parameters/WaslaPublicId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddIdentityLinkRequest'}
      responses:
        '200':
          description: الرابط أُضيف
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdentityLink'}
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /identity/users/{waslaPublicId}/recovery:
    post:
      tags: [Recovery]
      summary: بدء استرجاع الحساب عبر Wasla Public ID
      description: |
        Recovery لا يتجاوز الهوية — يبدأ خطوات تحقق وفق مستوى الحساب والمخاطر.
        يجب أن تكون وسيلة التحقق مناسبة (لا تعتمد على Telegram كمصدر وحيد).
      operationId: startRecovery
      security:
        - ServiceAuth:
            - identity:recovery:write
      parameters:
        - $ref: '#/components/parameters/WaslaPublicId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StartRecoveryRequest'}
      responses:
        '202':
          description: بدأت خطوات التحقق
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecoveryStarted'}
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /identity/users/{waslaPublicId}/history:
    get:
      tags: [History]
      summary: سجل تغييرات الهوية (Username/روابط)
      operationId: getIdentityHistory
      security:
        - ServiceAuth:
            - identity:history:read
      parameters:
        - $ref: '#/components/parameters/WaslaPublicId'
        - in: query
          name: field
          schema: {type: string, enum: [telegram_username, phone, link]}
      responses:
        '200':
          description: السجل
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/IdentityHistoryEntry'}
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          $ref: '#/components/responses/AuthForbidden'

  /identity/sessions:
    post:
      tags: [Sessions]
      summary: إصدار جلسة مستخدم من بصمة init-data متحقَّق منها
      description: |
        ADR-069 · CLM-0519 (المرحلة الأولى). يُصدِر جلسةً صادقةً (4 ساعات افتراضياً) من
        بصمةِ `init-data` موقَّعةٍ من قناةِ ثقةٍ (Telegram Mini App). **الفاعلُ يُشتقُّ من
        المنادي لا من جسمِ الطلبِ** (I-03): `customer-bot` يُصدِرُ جلسةَ `customer` و`driver-bot`
        يُصدِرُ جلسةَ `driver` — أيُّ `actor_type` في الجسمِ يُهجَرُ ولا يُقرأُ. تكرارُ نفسِ
        البصمةِ ⇒ 409 (`IDENTITY_SESSION_REPLAY`). الرمزُ الصريحُ يُعاد **مرّةً واحدةً
        فقط** ولا يُسجَّلُ في أيِّ سجلٍّ (I-13).
      operationId: issueUserSession
      security:
        - ServiceAuth:
            - identity:session:issue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueSessionRequest'
      responses:
        '201':
          description: جلسة صادرة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueSessionResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /identity/sessions/exchange:
    post:
      tags: [Sessions]
      summary: قايضة جلسة صالحة بتأكيد wua1 قصير العمر (≤60s)
      description: |
        ADR-069 · CLM-0519 (المرحلة الأولى). يُعيدُ تأكيداً `wua1` موقَّعاً بـ Ed25519
        يشهدُ أنّ مالكَ هذه الجلسةِ الصالحةِ هو `wasla_public_id`. فاعلُ الجلسةِ يُقارَنُ
        بفعلِ المنادي (I-10: `driver-bot` لا يستبدلُ جلسةَ `customer`). الرمزُ المنتهي ⇒ 401
        `AUTHN_EXPIRED` (I-07)، المُلغى أو غيرُ المعروف ⇒ 401 `AUTHN_UNAUTHENTICATED`
        بنفسِ النصِّ (I-08)، المستخدمُ الموقوفُ ⇒ 403 `IDENTITY_USER_SUSPENDED` (I-11)،
        بلا مفتاحِ توقيعٍ ⇒ 503 `IDENTITY_ASSERTION_UNAVAILABLE` (I-12). التأكيدُ لا يُسجَّلُ
        ولا يُرسَلُ في أيِّ سجلٍّ (I-13).
      operationId: exchangeUserSession
      security:
        - ServiceAuth:
            - identity:session:exchange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeSessionRequest'
      responses:
        '200':
          description: تأكيد صادر من جلسة صالحة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeSessionResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /identity/sessions/revoke:
    post:
      tags: [Sessions]
      summary: سحب جلسة مستخدم برموزها
      description: |
        ADR-069 · CLM-0519 (المرحلة الأولى). يُلغِي الجلسةَ المصادَقَ عليها برموزِها —
        مُتماثلُ التكرارِ عندَ المستودعِ. سحبُ ما لا وجودَ لهُ ⇒ 404 `IDENTITY_SESSION_NOT_FOUND`
        (لأنّ المُنادي يظنُّ حالةً غيرَ الواقعِ). السببُ يُسجَّلُ ولا يُفصَحُ عن رمزِ
        الجلسةِ في أيِّ سجلٍّ (I-13).
      operationId: revokeUserSession
      security:
        - ServiceAuth:
            - identity:session:revoke
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeSessionRequest'
      responses:
        '200':
          description: الجلسة سُحبت
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeSessionResponse'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /identity/assertions:
    post:
      tags: [Assertions]
      summary: إصدار تأكيد المستخدم النهائي wua1 لهوية قناة قائمة
      description: |
        ADR-060 · CLM-0440 · RISK-0042. يُصدِر تأكيداً موقَّعاً بـ Ed25519 (المفتاح الخاص عند identity وحدها)
        يشهد أن مستخدم القناة `telegram_user_id` هو `wasla_public_id`. **قراءة فقط**: لا يُنشئ مستخدماً
        (مستخدم غير مربوط ⇒ 404). نوع الفاعل يتبع المنادي (customer-bot → customer، driver-bot → driver،
        partner-bot → store_staff) والجمهور من قائمة مغلقة لكل فاعل. بلا مفتاح توقيع مُهيّأ ⇒ 503.
        البوت يُمرِّر التأكيد في ترويسة `x-wasla-user-assertion` مع `obo` مساوٍ لـ `wasla_public_id`،
        ولا يصنعه ولا يعدّله.
      operationId: issueUserAssertion
      security:
        - ServiceAuth:
            - identity:assertion:issue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueUserAssertionRequest'
      responses:
        '200':
          description: تأكيد صادر
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueUserAssertionResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /identity/core-bindings/{coreIdentityId}:
    get:
      tags: [CoreBindings]
      summary: قراءة ربط جيل حساب CORE بهوية MARKET
      description: |
        CLM-0701 · استثناءُ ADR-076 المؤرّخُ 2026-10-25. قراءةٌ فقط: يجيبُ ربطَ الجيلِ
        (identity_id من النواة) بهويّةِ MARKET المقابلةِ، أو 404 إن لم يُربَطِ الجيلُ بعدُ.
        يقرؤهُ مستهلكُ حدثِ `core.identity.account.deleted` في خدمةِ الزبائنِ ليصلَ إلى
        `wasla_public_id` صاحبِ البياناتِ — لا يُنشئُ شيئاً ولا يُغيّرُ شيئاً.
      operationId: getCoreIdentityBinding
      security:
        - ServiceAuth:
            - identity:core-binding:read
      parameters:
        - name: coreIdentityId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: ربطُ الجيلِ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreIdentityBinding'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        '404': {$ref: '#/components/responses/NotFound'}

  /identity/core-deletion:
    post:
      tags: [CoreBindings]
      summary: تطبيق حذف جيل حساب CORE على هويّة MARKET
      description: |
        CLM-0701. يُطبّقُ حدثَ `core.identity.account.deleted`: تحجيرُ هويّةِ الجيلِ
        (status=deleted) وإبطالُ كلّ جلساتِهِ — مُتماثلُ التكرارِ (تطبيقٌ ثانٍ لا يُغيّرُ
        شيئاً). لا ربطَ للجيلِ ⇒ `applied: false` مع `reason: unbound` (لا يُطبّقُ شيءٌ
        تخميناً — قابلٌ للإعادةِ عندَ وصولِ الربطِ). الجيلُ المحجّرُ لا يُعادُ ربطُهُ.
      operationId: applyCoreAccountDeletion
      security:
        - ServiceAuth:
            - identity:core-deletion:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyCoreDeletionRequest'
      responses:
        '200':
          description: نتيجةُ التطبيقِ (مُتماثِلةُ التكرارِ)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyCoreDeletionResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          $ref: '#/components/responses/AuthForbidden'

components:
  securitySchemes:
    ServiceAuth:
      type: apiKey
      in: header
      name: x-wasla-service-auth
      description: توقيعُ هويّةِ الخدمةِ الصادرُ عن `packages/service-auth`. كلُّ عمليّةٍ في هذا العقدِ تحملُ `security:` بصلاحيّةِ مسارِها — ما خلا العمليّاتِ المفتوحةَ بقرارٍ مكتوبٍ (مثلُ `/health`) — فلا يُقبَلُ نداءٌ بلا ترويسةٍ صحيحةٍ ([ADR-020](../../../docs/15-decisions/ADR-020-service-to-service-identity.md) · [ADR-021](../../../docs/15-decisions/ADR-021-service-token-replay-policy.md)).
  parameters:
    WaslaPublicId:
      name: waslaPublicId
      in: path
      required: true
      description: رقم الهوية المرئي والدائم (مثال WS-0000010427)
      schema:
        type: string
        pattern: '^WS-[0-9]{10}$'

  responses:
    BadRequest:
      description: طلب غير صالح
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: غير موجود
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: "تعارض (مثلاً: الرابط مرتبط بمستخدم آخر)"
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unprocessable:
      description: المدخلات صالحة شكلياً لكن غير مقبولة منطقياً
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ServiceUnavailable:
      description: الخدمة غير متاحة (degraded mode)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    AuthUnauthorized:
      description: طلبٌ بلا ترويسةِ هويّةِ خدمةٍ، أو بتوقيعٍ غيرِ صحيحٍ، أو برمزٍ منتهي الصلاحيّةِ أو مُستعمَلٍ ثانيةً. الردُّ لا يُفصِحُ عن السببِ الدقيقِ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AuthForbidden:
      description: هويّةُ خدمةٍ صحيحةٌ ولكنّ الصلاحيّةَ المطلوبةَ غيرُ ممنوحةٍ لهذهِ الخدمةِ، أو المُنتَفِعُ الموقَّعُ في الرمزِ لا يملكُ الموردَ المطلوبَ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ResolveIdentityRequest:
      type: object
      required: [telegram_user_id]
      properties:
        telegram_user_id:
          type: integer
          format: int64
          description: معرّف Telegram الرقمي (ليس Username) — المفتاح Idempotent
        telegram_username:
          type: string
          description: Username الحالي (يُسجَّل في History عند التغيير)
        telegram_language_code:
          type: string
        source:
          type: string
          enum: [customer_bot, driver_bot, partner_bot]
          description: مصدر الدخول (لأغراض Audit)
        core_identity_id:
          type: string
          minLength: 1
          description: >
            معرّفُ هويةِ النواةِ (identity_id) لجيلِ الحسابِ المصادَقِ عليهِ من
            جسرِ الويب (XR-6.1) — حضورُهُ يفعّلُ التسويةَ الواعيةَ بالأجيالِ
            (CLM-0701): جيلٌّ جديدٌ بعدَ حذفٍ يحصلُ على هويّةِ MARKET جديدةٍ
            فارغةٍ، والجيلُ القديمُ يفقدُ رابطَ القناةِ. غيابُهُ = السلوكُ القديمُ
            (إيجادٌ أو إنشاءٌ بلا ربطٍ).

    CoreIdentityBinding:
      type: object
      description: ربطُ جيلِ حسابِ CORE بهويّةِ MARKET (CLM-0701 · استثناءُ ADR-076)
      required: [core_identity_id, wasla_public_id, bound_at]
      properties:
        core_identity_id:
          type: string
        user_internal_uuid:
          type: string
          description: المعرّفُ الداخليُّ — لا يعبرُ استجابةً لغيرِ الخدماتِ (SECURITY_RULES §11)
        wasla_public_id:
          type: string
        bound_at:
          type: string
          format: date-time
        superseded_at:
          type: string
          format: date-time
          nullable: true
        superseded_by_core_identity_id:
          type: string
          nullable: true

    ApplyCoreDeletionRequest:
      type: object
      required: [core_identity_id]
      properties:
        core_identity_id:
          type: string
          minLength: 1
          description: جيلُ الحسابِ المحذوفُ في النواةِ (identity_id من الحدث)
        deleted_at:
          type: string
          format: date-time
          description: لحظةُ الحذفِ في النواةِ (من الحدثِ — للتدقيقِ)

    ApplyCoreDeletionResponse:
      type: object
      required: [applied, wasla_public_id]
      properties:
        applied:
          type: boolean
          description: true إن كانَ الجيلُ مربوطاً فحُجِّرَت هويّتُهُ وأُبطلت جلساتُهُ (أو كانَ محجّراً سلفاً)
        wasla_public_id:
          type: string
          description: الهويّةُ التي طاولها التطبيقُ — أو سلسلةٌ فارغةٌ إن لم يوجدْ ربطٌ
        reason:
          type: string
          description: unbound إن لم يكنِ الجيلُ مربوطاً (لا يُطبَّقُ شيءٌ — قابلٌ للإعادةِ)

    IssueUserAssertionRequest:
      type: object
      required: [telegram_user_id, actor_type, audience]
      properties:
        telegram_user_id: {type: integer, format: int64, minimum: 1}
        actor_type:
          type: string
          enum: [customer, driver, store_staff]
        audience:
          type: array
          minItems: 1
          maxItems: 4
          items: {type: string, pattern: '^[a-z][a-z0-9-]{1,39}$'}

    IssueSessionRequest:
      type: object
      required: [telegram_user_id, init_data_fingerprint]
      description: |
        بصمةُ init-data نتيجةُ `fingerprintInitData` في `@wasla/telegram-adapter` —
        ليست مفتاحَ منعِ إعادةٍ قابلٍ للصنعِ من أيِّ طلبٍ. `actor_type` إن وُجدَ يُهجَرُ
        (I-03: المنبعُ مسارُ الثقةِ).
      properties:
        telegram_user_id: {type: integer, format: int64, minimum: 1}
        init_data_fingerprint:
          type: string
          description: بصمة sha256 لرسالة init-data الموقَّعة
        actor_type:
          type: string
          description: يُهجَرُ ولا يُقرأُ — الفاعلُ من مسارِ الثقةِ (ADR-069 §2.6)
        telegram_username: {type: string}
        telegram_first_name: {type: string}
        telegram_language_code: {type: string}

    IssueSessionResponse:
      type: object
      required: [token, wasla_public_id, actor_type, expires_at, session_id]
      properties:
        token:
          type: string
          description: الرمز المُعتِم — يُعاد مرّةً واحدةً ولا يُسجَّل
        wasla_public_id: {type: string, pattern: '^WS-[0-9]{10}$'}
        actor_type:
          type: string
          enum: [customer, driver]
          description: مُشتقٌّ من مسارِ الثقةِ (هويّةِ الخدمةِ المنادية) لا من جسمِ الطلبِ
        expires_at: {type: string, format: date-time}
        session_id: {type: string, format: uuid}

    ExchangeSessionRequest:
      type: object
      required: [session_token, audience]
      properties:
        session_token:
          type: string
          description: رمز الجلسة الصادرة من `POST /identity/sessions`
        audience:
          type: array
          minItems: 1
          maxItems: 4
          items: {type: string, pattern: '^[a-z][a-z0-9-]{1,39}$'}

    ExchangeSessionResponse:
      type: object
      required: [assertion, wasla_public_id, actor_type, audience, expires_at]
      properties:
        assertion:
          type: string
          description: "wua1.<payload>.<sig> — يُمرَّر كما هو ولا يُسجَّل"
        wasla_public_id: {type: string, pattern: '^WS-[0-9]{10}$'}
        actor_type:
          type: string
          enum: [customer, driver]
        audience:
          type: array
          items: {type: string}
        expires_at:
          type: string
          format: date-time
          description: انتهاء التأكيد — لا يتجاوز 60 ثانية من الإصدار

    RevokeSessionRequest:
      type: object
      required: [session_token]
      properties:
        session_token:
          type: string
        reason:
          type: string
          description: سبب السحب (يُسجَّل) — يُفترَض `user_requested` عندَ الفراغِ

    RevokeSessionResponse:
      type: object
      required: [revoked, session_id]
      properties:
        revoked: {type: boolean}
        session_id: {type: string, format: uuid}

    IssueUserAssertionResponse:
      type: object
      required: [assertion, wasla_public_id, actor_type, audience, expires_at]
      properties:
        assertion:
          type: string
          description: "wua1.<payload>.<sig> — يُمرَّر كما هو ولا يُسجَّل"
        wasla_public_id: {type: string, pattern: '^WS-[0-9]{10}$'}
        actor_type:
          type: string
          enum: [customer, driver, store_staff]
        audience:
          type: array
          items: {type: string}
        expires_at: {type: string, format: date-time}
    ResolveIdentityResponse:
      type: object
      required: [wasla_public_id, internal_uuid, created]
      properties:
        wasla_public_id: {type: string, pattern: '^WS-[0-9]{10}$'}
        internal_uuid:
          type: string
          format: uuid
          description: داخلي فقط — لا يُعرض للمستخدم النهائي
        created: {type: boolean, description: true إذا أُنشئ مستخدم جديد في هذه العملية}
        links:
          type: array
          items: {$ref: '#/components/schemas/IdentityLink'}

    User:
      type: object
      required: [wasla_public_id, status, created_at]
      properties:
        wasla_public_id: {type: string, pattern: '^WS-[0-9]{10}$'}
        status:
          type: string
          enum: [active, suspended, deleted, recovery_in_progress]
        created_at: {type: string, format: date-time}
        links:
          type: array
          items: {$ref: '#/components/schemas/IdentityLink'}

    IdentityLink:
      type: object
      required: [provider, external_id]
      properties:
        provider:
          type: string
          enum: [telegram, phone, email, web, mobile]
        external_id:
          type: string
          description: المعرّف الخارجي (telegram_user_id / رقم هاتف normalyzed / ...)
        verified: {type: boolean}
        linked_at: {type: string, format: date-time}

    AddIdentityLinkRequest:
      type: object
      required: [provider, external_id]
      properties:
        provider: {type: string, enum: [telegram, phone, email, web, mobile]}
        external_id: {type: string}
        verified: {type: boolean}

    StartRecoveryRequest:
      type: object
      required: [verification_method]
      properties:
        verification_method:
          type: string
          enum: [phone_otp, email_otp, admin_assisted]
          description: يجب ألا تعتمد على Telegram كمصدر وحيد

    RecoveryStarted:
      type: object
      required: [recovery_id, status]
      properties:
        recovery_id: {type: string, format: uuid}
        status: {type: string, enum: [verification_pending, completed, rejected]}

    IdentityHistoryEntry:
      type: object
      required: [field, old_value, new_value, effective_at, source]
      properties:
        field:
          type: string
          enum: [telegram_username, phone, link]
        old_value: {type: string, nullable: true}
        new_value: {type: string}
        effective_at: {type: string, format: date-time}
        source:
          type: string
          enum: [customer_bot, driver_bot, partner_bot, recovery, admin, system]

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: كود خطأ ثابت (راجع errors.md)
        message:
          type: string
        trace_id: {type: string}
    ErrorResponse:
      type: object
      required:
        - code
        - message
        - trace_id
      properties:
        code:
          type: string
          description: كود ثابت (stable)
        message:
          type: string
        trace_id:
          type: string

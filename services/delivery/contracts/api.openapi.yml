openapi: 3.1.0
info:
  title: WASLA Delivery Service API (Store Orders & Delivery)
  version: 0.1.0
  description: |
    عقدُ واجهةِ خدمةِ التوصيلِ (Phase 13 — Contract First · ADR-004).

    المبادئُ الحاكمةُ (ADR-026): طلبُ المتجرِ مجموعةٌ مستقلّةٌ عن طلبِ النقلِ (§2.1) ·
    حالةُ الدفعِ مرآةُ مرجعٍ خارجيٍّ (§2.2) · لا قراءةَ مخزونٍ إلا عبرَ الحدِّ المتَّفقِ
    عليهِ (§2.3) · التوصيلُ مرآةٌ خشنةٌ لنتائجِ dispatch (§2.4) · الاستبدالُ قرارُ صنفٍ
    (§2.5) · لا بياناتِ شخصيّةَ ولا إحداثيّاتٍ في أيِّ حمولةٍ (§2.6).

    **حالةُ التنفيذِ (مراجعةٌ 7/N · `CLM-0126`):** طبقةُ HTTP **مُنفَّذةٌ** بـFastify فوقَ
    هذا العقدِ حرفاً (`services/delivery/src/http/`) بمعالجِ أخطاءٍ واحدٍ ومنافذَ
    مُحقونةٍ — رُفعَ تأجيلُ ADR-026 §4.2 في نصِّهِ الخاصِّ بالحدِّ الشبكيِّ وبمخزنِ
    الطلباتِ على PostgreSQL.

    **كتالوجُ السوقِ موصولٌ (مراجعةٌ 8/N · `CLM-0127` — رُفِعَ دَينُ ADR-026 §4.9-2):**
    `POST /store-orders` يقرأُ المتجرَ ولقطاتِ السعرِ من حدِّ السوقِ المنشورِ عبرَ
    HTTP (`GET /stores/{storeSlug}` ثمّ `GET /products/{productId}`) بنداءٍ
    **موقَّعٍ** (ADR-020). ومرجعُ المتجرِ في هذا العقدِ صارَ `store_slug` — المرجعَ
    الذي ينشرُهُ السوقُ فعلاً — بدلَ `WS-##########` الذي لم يكن يُطابقُ شيئاً
    هناك. والفرقُ محفوظٌ: «لا متجرَ بهذا الـslug» ⇒ `400`، و«لا نعلمُ» (عطلٌ أو
    مَهَلٌ) ⇒ `503 DELIVERY_MARKETPLACE_UNAVAILABLE`. ومتجرٌ غيرُ موافَقٍ عليه ⇒
    `409 DELIVERY_INELIGIBLE`.

    **مرآةُ الدفعِ والتأكيدُ (مراجعةٌ 9/N · `CLM-0128`):** `PUT
    /store-orders/{orderPublicId}/payment-mirror` يعكسُ حالةَ نيّةِ الدفعِ الخارجيّةِ
    (§3.2) بلا أيِّ حقلٍ ماليٍّ، و`POST /store-orders/{orderPublicId}/confirmation`
    يُطبّقُ البوّابةَ المركَّبةَ §2.2: `placed → confirmed` لا تمرُّ إلاّ بمرآةٍ
    `authorized`، وإلاّ `409 DELIVERY_PAYMENT_NOT_AUTHORIZED`. وبهذا صارَ محورُ
    «مخزونٍ/دفعٍ» قابلاً للسَّوقِ من طرفٍ إلى طرفٍ في بوّابةِ خروجِ الطورِ
    (`packages/delivery-e2e`).

    **مفتاحُ التماثُلِ (مراجعةٌ 7/N — رُفِعَ دَينُ §4.9-3 · وُسِّعَ في 9/N):** المساراتُ
    الكاتبةُ الأربعةُ تطلبُ ترويسةَ `Idempotency-Key` **إلزاماً**؛ الإعادةُ بالمفتاحِ
    نفسِهِ والطلبِ نفسِهِ تُعيدُ جوابَ الأولِ حرفاً مع `Idempotent-Replay: true`
    ولا تكتبُ شيئاً؛ والمفتاحُ نفسُهُ بطلبٍ مختلفٍ يُرفَضُ
    `409 DELIVERY_IDEMPOTENCY_KEY_REUSED`. ومع المفتاحِ **يبقى** الملاذُ الأخيرُ
    `500` لا `503` (contracts/errors.md قاعدةُ 5).

    **مَهَلُ الإعادةِ مقيسٌ لا مُقدَّرٌ (مراجعةٌ 19/N · `CLM-0140` — رُفِعَ دَينُ
    ADR-026 §4.10-1 القائمُ منذُ المراجعةِ 7/N):** رفضُ
    `409 DELIVERY_IDEMPOTENT_REQUEST_IN_FLIGHT` صارَ يحملُ `Retry-After: 1`
    (انظر `components/responses/ConflictError`). وهيَ **الترويسةُ الأولى
    المُعلَنةُ آليّاً في هذا العقدِ** — و`Idempotent-Replay` تبقى نصّاً في الوصفِ
    لأنَّها على أجوبةِ النجاحِ الخمسةِ لا على مُكوِّنٍ واحدٍ مُشترَكٍ. **ولا حقلَ
    رابعَ في `ErrorResponse`**: الشكلُ ثلاثةُ حقولٍ كما نُشِرَ، والترويسةُ سطحُ
    النقلِ الذي وضعَهُ المعيارُ لهذا المعنى.

    **الجاهزيّةُ (رُفِعَ دَينُ §4.9-4):** `GET /delivery/ready` يسبُرُ القاعدةَ
    فعلاً، ويُجيبُ **بجسمِ `ReadinessResponse` نفسِهِ في 200 و503 معاً** — الاستثناءُ
    الوحيدُ المُعلَنُ لقاعدةِ «كلُّ خطأٍ جسمُ `ErrorResponse`»، لأنَّ المسبارَ
    يُبلِّغُ حالةً لا عيباً.
servers:
  - url: http://localhost:8097
    description: تشغيلٌ محليٌّ — `services/delivery/src/http/server.ts` (المراجعةُ 6/N)
tags:
  - name: store-orders
    description: دورةُ حياةِ طلبِ المتجرِ (F1)
  - name: delivery
    description: مهمّةُ التوصيلِ (F2)
  - name: health
paths:
  /store-orders:
    post:
      tags: [store-orders]
      operationId: placeStoreOrder
      summary: إنشاءُ طلبِ متجرٍ (تأكيدُ السلّةَ draft → placed)
      description: |
        لقطةُ الأصنافِ (كميّةٌ · سعرُ وقتِ الطلبِ) تُثبَّتُ هنا ولا تُقرأُ من الكتالوجِ
        بعدَها (ADR-026 §2.3). أهليّةُ الأصنافِ تُقرأُ من السوقِ عبرَ الحدِّ المتَّفقِ
        عليهِ لا من فهرسِ البحثِ (ADR-025 §2.2).
      security:
        - ServiceAuth:
            - delivery:store-order:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceStoreOrderRequest"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: طلبٌ مُنشأٌ في placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreOrderResponse"
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /store-orders/{orderPublicId}:
    get:
      tags: [store-orders]
      operationId: getStoreOrder
      summary: قراءةُ طلبِ متجرٍ
      security:
        - ServiceAuth:
            - delivery:store-order:read
      parameters:
        - name: orderPublicId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/WaslaPublicId"
      responses:
        "200":
          description: الطلبُ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreOrderResponse"
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"
  /store-orders/{orderPublicId}/cancellation:
    post:
      tags: [store-orders]
      operationId: cancelStoreOrder
      summary: إلغاءُ طلبِ متجرٍ (قبلَ التسليمِ للمناديبِ)
      security:
        - ServiceAuth:
            - delivery:store-order:cancel
      parameters:
        - name: orderPublicId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/WaslaPublicId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelStoreOrderRequest"
      responses:
        "200":
          description: الطلبُ مُلغىً (أو إعادةُ جوابِ إلغاءٍ سابقٍ بالمفتاحِ نفسِهِ)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreOrderResponse"
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "500":
          $ref: "#/components/responses/InternalError"
  /store-orders/{orderPublicId}/payment-mirror:
    put:
      tags: [store-orders]
      operationId: mirrorStoreOrderPayment
      summary: تحديثُ مرآةِ الدفعِ (حالةٌ خارجيّةٌ تُعكَسُ ولا تُقرَّرُ هنا)
      description: |
        `PUT` لا `POST`: المُرسِلُ يُعلنُ الحالةَ التي يراها عندَ مُزوِّدِ الدفعِ، وإعلانُ
        الحالةِ نفسِها بالمرجعِ نفسِهِ مرّتَينِ لا يُنشئُ انتقالاً ثانياً (200 بلا أثرٍ).

        والخدمةُ لا تُعالجُ مالاً (ADR-026 §2.2): لا مبلغَ في الجسمِ ولا وسيلةَ دفعٍ،
        و`payment_ref` مرجعٌ opaque لا يُردُّ في أيِّ قراءةٍ (§2.6). وانتقالٌ خارجَ جدولِ
        §3.2 يُرفَضُ `409 DELIVERY_TRANSITION_NOT_ALLOWED` — المرآةُ تعكسُ تاريخاً ممكناً لا
        أيَّ تاريخٍ.
      security:
        - ServiceAuth:
            - delivery:payment-mirror:write
      parameters:
        - name: orderPublicId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/WaslaPublicId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentMirrorRequest"
      responses:
        "200":
          description: المرآةُ مُحدَّثةٌ (أو مُعلَنٌ لها ما هيَ عليهِ أصلاً — بلا أثرٍ)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreOrderResponse"
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "500":
          $ref: "#/components/responses/InternalError"
  /store-orders/{orderPublicId}/confirmation:
    post:
      tags: [store-orders]
      operationId: confirmStoreOrder
      summary: تأكيدُ طلبٍ (placed → confirmed — ولا يمرُّ إلاّ بمرآةٍ authorized)
      description: |
        البوّابةُ المركَّبةُ (ADR-026 §2.2): التأكيدُ قرارُ تنفيذٍ، وشرطُهُ أنَّ مرآةَ
        الدفعِ `authorized`. مرآةٌ `pending` تُرفَضُ `409 DELIVERY_PAYMENT_NOT_AUTHORIZED`
        وليسَ `TRANSITION_NOT_ALLOWED`: الفرقُ بينَ «انتظِر التخويلَ» و«لا طريقَ من هنا»
        يجبُ أن يبقى مقروءاً للعميلِ.

        ولا جسمَ للطلبِ: السببُ معروفٌ ومغلقٌ (`PAYMENT_AUTHORIZED`)، وحقلٌ حرٌّ هنا
        كانَ سيصبحُ مكانَ تخزينٍ لملاحظاتٍ لا يقرأُها أحدٌ.
      security:
        - ServiceAuth:
            - delivery:store-order:confirm
      parameters:
        - name: orderPublicId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/WaslaPublicId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: الطلبُ مُؤكَّدٌ (أو إعادةُ جوابِ تأكيدٍ سابقٍ بالمفتاحِ نفسِهِ)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreOrderResponse"
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "500":
          $ref: "#/components/responses/InternalError"
  /store-orders/{orderPublicId}/fulfillment-transition:
    post:
      tags: [store-orders]
      operationId: fulfillmentTransition
      summary: انتقالُ تنفيذٍ (confirmed → picking → ... → delivered)
      description: |
        مسارٌ واحدٌ يُديرُ انتقالاتِ الإكمالِ الستّةَ الباقيةَ (المراجعةُ 11/N،
        ADR-026 §4.13): `confirmed → picking → picked → ready_for_delivery →
        handed_to_courier → delivered`.

        حافّةُ `handed_to_courier → delivered` تتطلَّبُ إثباتَ تسليمٍ (`proof_type`
        و`proof_ref`) وتُحرِّكُ الخصمَ النهائيَّ للمخزونِ (`reserved → consumed`) في
        نفسِ المعاملةِ — لا نداءَ للسوقِ: الحجزُ خصمٌ بالفعل.
      security:
        - ServiceAuth:
            - delivery:fulfillment:transition
      parameters:
        - name: orderPublicId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/WaslaPublicId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to_state]
              properties:
                to_state:
                  $ref: "#/components/schemas/FulfillmentState"
                proof_type:
                  type: string
                  enum: [otp, photo, signature, pin_code]
                  description: مطلوبٌ عندَ to_state=delivered.
                proof_ref:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: مطلوبٌ عندَ to_state=delivered.
      responses:
        "200":
          description: انتقلَ الطلبُ إلى الحالةِ المطلوبةِ (أو إعادةُ جوابٍ سابقٍ)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreOrderResponse"
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "500":
          $ref: "#/components/responses/InternalError"
  /store-orders/{orderPublicId}/delivery-task:
    get:
      tags: [delivery]
      operationId: getDeliveryTaskForOrder
      summary: مهمّةُ التوصيلِ لطلبِ متجرٍ
      security:
        - ServiceAuth:
            - delivery:delivery-task:read
      parameters:
        - name: orderPublicId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/WaslaPublicId"
      responses:
        "200":
          description: المهمّةُ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryTaskResponse"
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '403':
          $ref: '#/components/responses/AuthForbidden'
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"
  /delivery/health:
    get:
      tags: [health]
      operationId: getDeliveryHealth
      summary: نبضةُ حياةِ الخدمة
      responses:
        "200":
          description: الخدمةُ حيّةٌ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /delivery/ready:
    get:
      tags: [health]
      operationId: getDeliveryReadiness
      summary: جاهزيّةُ الخدمةِ (سبرٌ حقيقيٌّ للتبعيّاتِ)
      description: |
        ليس نبضةً: يسألُ القاعدةَ بـ`SELECT` على جدولٍ حقيقيٍّ بمهلةٍ
        قصيرةٍ. **ما لا يُسبَرُ لا يُدّعى**، ومنذُ المراجعةِ 8/N صارَ الفرقُ
        ثلاثيّاً لا ثنائيّاً: كتالوجُ السوقِ **موصولٌ** الآنَ (§4.11) لكنَّ
        الجاهزيّةَ لا تسبرُهُ، فيُذكَرُ `marketplace_catalog_not_probed`؛ وإن
        لم يُوصَلْ في تركيبٍ ما فيُذكَرُ `marketplace_catalog_not_wired`. وفي
        الحالَينِ لا يُحسَبُ جاهزيّةً ولا يجعلُ المسارَ 503 أبديّاً (درسُ
        RISK-0030). ولماذا لا يُسبَرُ؟ لأنَّ سبرَ حدٍّ خارجيٍّ في كلِّ نبضةِ
        جاهزيّةٍ يُحوّلُ مِجَسَّ المنظِّمِ إلى حِمْلٍ على السوقِ، ويجعلُ عطلَ
        السوقِ يُخرِجُ هذه الخدمةَ من الخدمةِ كلَّها — بينما القراءةُ والإلغاءُ
        يعملانِ بلا سوقٍ.

        ومنذُ المراجعةِ 15/N صارَ الفرقُ **رباعيّاً**: إن رُكِّبَ مسبارُ
        الرصدِ (`MARKETPLACE_SERVICE_URL`) سُئِلَ حدُّ السوقِ فعلاً، فيُفرَغُ
        `not_claimed` وتظهرُ مُدخلةٌ في `dependencies` بعمرِها. والحُجّتانِ
        أعلاهُ لم تُنقَضا: السبرُ **مُخزَّنٌ بمهلةِ صلاحيّةٍ** فالحِمْلُ مسقوفٌ
        بنداءٍ واحدٍ لكلِّ نُسخةٍ لكلِّ مهلةٍ لا بعددِ النبضاتِ، و**لا يحكمُ
        `status`** فلا يُخرِجُ عطلُ السوقِ هذه الخدمةَ من الدورةِ.
      responses:
        "200":
          description: جاهزٌ — كلُّ ما يُسبَرُ يستجيبُ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: |
            غيرُ جاهزٍ — **والجسمُ `ReadinessResponse` لا `ErrorResponse`**
            (الاستثناءُ الوحيدُ المُعلَنُ · errors.md قاعدةُ 6).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
components:
  securitySchemes:
    ServiceAuth:
      type: apiKey
      in: header
      name: x-wasla-service-auth
      description: توقيعُ هويّةِ الخدمةِ الصادرُ عن `packages/service-auth`. كلُّ عمليّةٍ في هذا العقدِ تحملُ `security:` بصلاحيّةِ مسارِها — ما خلا العمليّاتِ المفتوحةَ بقرارٍ مكتوبٍ (مثلُ `/health`) — فلا يُقبَلُ نداءٌ بلا ترويسةٍ صحيحةٍ ([ADR-020](../../../docs/15-decisions/ADR-020-service-to-service-identity.md) · [ADR-021](../../../docs/15-decisions/ADR-021-service-token-replay-policy.md)).
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        مفتاحٌ يولِّدُهُ العميلُ للطلبِ الواحدِ ويُعيدُهُ حرفاً مع كلِّ محاولةِ
        إعادةٍ. uuid v4 يستوفيهِ. الحدُّ الأدنى 16 محرفاً مقصودٌ: مفتاحٌ قصيرٌ
        يتصادمُ بينَ عميلَينِ، والتصادمُ هنا يعني عميلاً يقرأُ جوابَ طلبِ غيرِهِ.
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{15,127}$"
  responses:
    ValidationError:
      description: مدخلاتٌ غيرُ صالحةٍ
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFoundError:
      description: غيرُ موجودٍ
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ConflictError:
      description: |
        تعارُضٌ معَ حالةٍ قائمةٍ (انتقالٌ غيرُ جائزٍ · مخزونٌ لا يكفي · مفتاحُ
        تماثُلٍ مُعادُ الاستعمالِ · مفتاحٌ قيدَ معاملةٍ أخرى).

        **`Retry-After` يُقالُ على رمزٍ واحدٍ وحدَهُ** (المراجعةُ 19/N · ADR-026
        §4.21): `DELIVERY_IDEMPOTENT_REQUEST_IN_FLIGHT`. وما عداهُ من أكوادِ هذا
        الحالِ **لا يحملُها بقصدٍ**: مفتاحٌ بجسمٍ مختلفٍ لن تنجحَ إعادتُهُ أبداً،
        وتعارُضُ نسخةٍ يُصلَحُ بقراءةٍ ثمَّ قرارٍ جديدٍ لا بإعادةِ الطلبِ نفسِهِ.
      headers:
        Retry-After:
          required: false
          description: |
            مَهَلٌ **مقيسٌ** بالثوانِ (`delay-seconds` — RFC 9110 §10.2.3) لا
            تاريخُ HTTP، فلا يُشترَطُ اتّفاقُ ساعةِ المنادي وساعةِ الخدمةِ.

            يحضُرُ **فقط** معَ `error_code = DELIVERY_IDEMPOTENT_REQUEST_IN_FLIGHT`،
            وقيمتُهُ `1`. وسندُها قياسٌ لا تقديرٌ: لحظةَ نُطقِ الرفضِ يكونُ صفُّ
            الطلبِ الرابحِ **مُثبَتاً** في القاعدةِ، فإعادةٌ بالمفتاحِ نفسِهِ
            والجسمِ نفسِهِ تُعيدُ جوابَ الأوّلِ حرفاً معَ `Idempotent-Replay: true`.
            والثانيةُ الواحدةُ فائضٌ على المقيسِ (صفرٌ) لا عجزٌ عنهُ، وإنّما لم
            تُكتَبْ `0` كي لا تُقرأَ أمراً بالدَّوَرانِ.
          schema:
            type: integer
            minimum: 1
            examples: [1]
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    DependencyUnavailable:
      description: تبعيّةٌ (السوقُ · dispatch) غيرُ متاحةٍ
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: |
        خطأٌ غيرُ مُصنَّفٍ (`DELIVERY_INTERNAL_ERROR`) — **لا يُعادُ الطلبُ تلقائيّاً**:
        لا مفتاحَ تماثُلٍ في هذا العقدِ، فإعادةُ `POST /store-orders` قد تُنشئُ طلبَينِ.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AuthUnauthorized:
      description: طلبٌ بلا ترويسةِ هويّةِ خدمةٍ، أو بتوقيعٍ غيرِ صحيحٍ، أو برمزٍ منتهي الصلاحيّةِ أو مُستعمَلٍ ثانيةً. الردُّ لا يُفصِحُ عن السببِ الدقيقِ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AuthForbidden:
      description: هويّةُ خدمةٍ صحيحةٌ ولكنّ الصلاحيّةَ المطلوبةَ غيرُ ممنوحةٍ لهذهِ الخدمةِ، أو المُنتَفِعُ الموقَّعُ في الرمزِ لا يملكُ الموردَ المطلوبَ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    WaslaPublicId:
      type: string
      pattern: "^WS-[0-9]{10}$"
      description: مرجعٌ opaque — لا بياناتِ شخصيّةَ (ADR-026 §2.6)
    StoreSlug:
      type: string
      pattern: "^[a-z][a-z0-9-]{2,47}$"
      description: |
        مرجعُ المتجرِ العامُّ: **الـslug الذي ينشرُهُ السوقُ** ويستعملُهُ في كلِّ
        مسارٍ عامٍّ (`GET /stores/{storeSlug}`)، ومقفولٌ عندَه بعدَ أوّلِ موافقةٍ.
        وهو **ليس** `WaslaPublicId`: لا صيغةَ `WS-` له ولا opacity — قاعدةُ
        ADR-026 §2.6 تلزمُ المراجعَ التي تُصدرُها وصلةٌ نفسُها، أمّا مرجعُ
        المتجرِ فمِلكُ السوقِ، فيُستعمَلُ كما نُشِرَ لا كما نتمنّاه
        (المراجعةُ 8/N · §4.11).
    FulfillmentState:
      type: string
      enum: [draft, placed, confirmed, picking, picked, ready_for_delivery, assigned, handed_to_courier, delivered, cancelled, rejected, failed]
    PaymentState:
      type: string
      enum: [pending, authorized, captured, failed, refunding, partially_refunded, refunded]
    InventoryState:
      type: string
      enum: [none, reserving, reserved, released, consumed]
      description: حالةُ حجزِ المخزونِ على الطلبِ (المراجعةُ 10/N · ADR-026 §2.3)
    DeliveryTaskState:
      type: string
      enum: [pending_eligibility, eligible, dispatch_requested, driver_assigned, timed_out, reassigned, exhausted, picked_up, in_transit, arrived, delivered, ineligible, failed, cancelled]
    ProofType:
      type: string
      enum: [otp, photo, signature, pin_code]
    OrderLineInput:
      type: object
      required: [product_id, quantity]
      properties:
        product_id:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
    PlaceStoreOrderRequest:
      type: object
      required: [customer_ref, store_slug, items]
      properties:
        customer_ref:
          $ref: "#/components/schemas/WaslaPublicId"
        store_slug:
          $ref: "#/components/schemas/StoreSlug"
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderLineInput"
        delivery_fee_minor_units:
          type: integer
          minimum: 0
          description: رسومُ التوصيلِ (هللة) — لقطةُ عرضِ التوصيلِ وقتَ الطلبِ
    CancelStoreOrderRequest:
      type: object
      required: [reason_code]
      properties:
        reason_code:
          type: string
          enum: [CUSTOMER_CHANGED_MIND, CUSTOMER_UNAVAILABLE, PAYMENT_FAILED, STORE_REQUESTED, SYSTEM_MAINTENANCE, DELIVERY_NOT_FEASIBLE]
    PaymentMirrorRequest:
      type: object
      additionalProperties: false
      required: [payment_state, reason_code]
      description: |
        مرآةُ نيّةٍ خارجيّةٍ: حالةٌ وسببٌ مغلقٌ ومرجعٌ — ولا حقلَ ماليَّ واحداً.
        `additionalProperties: false` مقصودٌ: حقلٌ زائدٌ يُجاوَزُ صامتاً هو كيفَ يظنُّ
        مُزوِّدٌ أنَّ وصلةَ حفظت مبلغاً ولم تحفظهُ.
      properties:
        payment_state:
          $ref: "#/components/schemas/PaymentState"
        reason_code:
          type: string
          enum: [AUTHORIZATION_SUCCEEDED, CAPTURE_SUCCEEDED, AUTHORIZATION_FAILED, REFUND_INITIATED, REFUND_COMPLETED, PARTIAL_REFUND_COMPLETED]
        payment_ref:
          type: [string, "null"]
          minLength: 1
          maxLength: 128
          description: مرجعُ النيّةِ عندَ المُزوِّدِ — opaque ولا يُردُّ في أيِّ قراءةٍ (§2.6).
    OrderLine:
      type: object
      required: [line_no, product_id, sku, quantity, unit_price_minor_units, line_total_minor_units]
      properties:
        line_no:
          type: integer
          minimum: 1
        product_id:
          type: string
          format: uuid
        sku:
          type: string
        quantity:
          type: integer
          minimum: 1
        unit_price_minor_units:
          type: integer
          minimum: 0
        line_total_minor_units:
          type: integer
          minimum: 0
        substituted_product_id:
          type: [string, "null"]
          format: uuid
        substitution_reason:
          type: [string, "null"]
          enum: [out_of_stock, customer_approved_alternative, store_policy, null]
    StoreOrderResponse:
      type: object
      required: [order_id, public_id, customer_ref, store_slug, fulfillment_state, payment_state, inventory_state, currency_code, items_total_minor_units, delivery_fee_minor_units, total_minor_units, items, version]
      properties:
        order_id:
          type: string
          format: uuid
        public_id:
          $ref: "#/components/schemas/WaslaPublicId"
        customer_ref:
          $ref: "#/components/schemas/WaslaPublicId"
        store_slug:
          $ref: "#/components/schemas/StoreSlug"
        fulfillment_state:
          $ref: "#/components/schemas/FulfillmentState"
        payment_state:
          $ref: "#/components/schemas/PaymentState"
        inventory_state:
          $ref: "#/components/schemas/InventoryState"
        inventory_ref:
          type: string
          nullable: true
          maxLength: 128
          description: مرجعُ الحجزِ عندَ السوقِ (المراجعةُ 10/N)
        currency_code:
          type: string
          const: SAR
        items_total_minor_units:
          type: integer
        delivery_fee_minor_units:
          type: integer
        total_minor_units:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderLine"
        version:
          type: integer
    DeliveryTaskResponse:
      type: object
      required: [task_id, order_id, state, version]
      properties:
        task_id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        state:
          $ref: "#/components/schemas/DeliveryTaskState"
        ineligibility_reason:
          type: [string, "null"]
          enum: [outside_coverage, store_not_orderable, no_courier_service, null]
        dispatch_job_ref:
          type: [string, "null"]
        courier_ref:
          type: [string, "null"]
          description: مرجعٌ opaque للمندوبِ — لا اسمَ ولا هاتفَ (ADR-026 §2.6)
        proof_type:
          type: [string, "null"]
          $ref: "#/components/schemas/ProofType"
        proof_ref:
          type: [string, "null"]
        version:
          type: integer
    ErrorResponse:
      type: object
      required: [error_code, message, trace_id]
      properties:
        error_code:
          type: string
          description: كودٌ ثابتٌ من كتالوجِ errors.md — لا نصٍّ حرٍّ
        message:
          type: string
          description: رسالةٌ للسجلِّ لا للمستخدمِ (التوطينُ مسارُ قناةٍ)
        trace_id:
          type: string
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ReadinessResponse:
      type: object
      required: [status, checks, not_claimed, dependencies]
      description: |
        جسمُ الجاهزيّةِ في 200 و503 معاً. `status` يُشتَقُّ من `checks`
        المسبورةِ وحدَها؛ و`not_claimed` تبعيّاتٌ مُعلَنةٌ غيرُ موصولةٍ
        لا تُسبَرُ ولا تُدّعى — إعلانٌ لا إخفاءٌ.

        و`dependencies` (المراجعةُ 15/N · §4.17) رصدٌ **مُعلِمٌ لا حاكمٌ**:
        سبرٌ لحدِّ السوقِ مُخزَّنٌ بمهلةِ صلاحيّةٍ، يُنشَرُ بعمرِهِ
        (`age_ms`) **ولا يُغيّرُ `status`** — ولذا يُعلَنُ في كلِّ مُدخلةٍ
        `gates_readiness: false` على السلكِ لا في وثيقةٍ خارجَهُ. فعطلُ
        السوقِ يُقرأُ ولا يُخرِجُ هذه الخدمةَ من الدورةِ.
      properties:
        status:
          type: string
          enum: [ready, unavailable]
        checks:
          type: array
          items:
            type: object
            required: [name, ok]
            properties:
              name:
                type: string
                enum: [database]
              ok:
                type: boolean
              detail:
                type: string
                description: سببٌ مقتضبٌ للسجلِّ لا للمستخدمِ — لا أسرارَ ولا مُدخَلاتٍ.
        not_claimed:
          type: array
          items:
            type: string
            enum: [marketplace_catalog_not_wired, marketplace_catalog_not_probed]
        dependencies:
          type: array
          description: |
            أرصادُ تبعيّاتٍ خارجيّةٍ. فارغةٌ إن لم يُركَّبْ مسبارٌ — وحينَها
            يبقى `not_claimed` معلناً أنَّ التبعيّةَ لم تُسبَرْ.
          items:
            type: object
            required: [name, ok, observed_at, age_ms, gates_readiness]
            properties:
              name:
                type: string
                enum: [marketplace_catalog]
              ok:
                type: boolean
              detail:
                type: string
                description: |
                  سببٌ من مِعجمٍ مغلقٍ: marketplace_unreachable ·
                  marketplace_timeout · marketplace_denied_identity ·
                  marketplace_error_status · marketplace_unreadable_body ·
                  marketplace_contract_drift · marketplace_degraded ·
                  marketplace_unavailable · probe_threw. لا نصَّ استثناءٍ
                  ولا اسمَ مضيفٍ ولا سرَّ.
              observed_at:
                type: string
                format: date-time
              age_ms:
                type: integer
                minimum: 0
                description: عمرُ الرصدِ المُخزَّنِ — لا يكونُ سالباً ولو رجعَت ساعةُ النظامِ.
              gates_readiness:
                type: boolean
                const: false
                description: مُعلَنٌ ثابتاً — الرصدُ لا يحكمُ `status` أبداً.

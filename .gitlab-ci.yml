# ──────────────────────────────────────────────────────────────
# بوابة خروج المرحلة 08 (MR 6/6) — سؤال واحد: «طرفان يتفاوضان على سعر عبر
# أربع خدمات مستقلّة على HTTP حقيقي فيتّفقان، فينتهي **محرّك الطلب** حاملاً
# ذاك الرقم — ويبقى الاتفاق قائماً حين لا يكون المحرّك موجوداً»:
#   packages/negotiation-e2e/src/__tests__/phase08-exit-gate.e2e.test.ts
#
# أربعة مسارات ملزمة، كلٌّ منها نهاية يجب أن تكون قابلة للوصول وقابلة للإثبات:
# مسار سعيد (طلب حقيقي بـ price_mode=negotiable من نواة العميل، موجة توزيع
# حقيقية، خيط على عرضها، جولة، قبول، ثمّ السعر مقروءاً من GET /orders/lookup
# مربوطاً بمعرّف التفاوض)، وإعادة بالمفتاح نفسه (اتفاق واحد وسعر واحد ومحاولة
# تسليم واحدة · 201 ثم 200)، ورفض نهائي من المحرّك (عرضان حيّان على طلب واحد
# فاتفاقان، المحرّك يقبل الأول ويرفض الثاني بـ ORDER_AGREED_PRICE_ALREADY_SET؛
# الاتفاق الثاني يبقى صحيحاً و`handoff_state=rejected` والقبول 201 ولا 502 في
# أي موضع — ADR-013 القرار 2)، ومحرّك غير قابل للوصول (القبول 201 والاتفاق
# pending بلحظة إعادة محاولة، ثمّ يرجع المحرّك على المنفذ نفسه ويتجاوز الوقت
# المحقون التراجع فتُسلّم النبضة الواحدة السعر).
#
# الملف نفسه يعمل داخل build-test بمخازن in-memory — فالبوابة يجب أن تُثبَت
# على كل MR دون قاعدة بيانات — وهذه الوظيفة ترفع خدمة التفاوض على Postgres
# حقيقي، فيصبح ما تضيفه هو ما لا تُثبته الذاكرة: أنّ فهرس
# ux_negotiation_agreements_thread يمنع اتفاقاً ثانياً على مستوى المحرّك لا
# على مستوى الكائن، وأنّ صفوف negotiation_price_handoffs تُكتب فعلاً فيبقى
# للتدقيق أثرُ كل محاولة تسليم وسببُ فشلها المسمّى، وأنّ next_handoff_at
# يُقرأ من القاعدة كما كُتب لا من حساب ثانٍ في الذاكرة، وأنّ /health يقول
# postgres بدل memory لأنّ التخزين صار دائماً.
#
# المتغيّر هو NEGOTIATION_DATABASE_URL وليس DATABASE_URL بقصد، للسبب نفسه
# المشروح في بوابتَي المرحلة 07 و05: الثاني هو مخزن طبقة القناة (المرحلة 03)
# وهو أيضاً المتغيّر الذي تستعمله negotiations-db-integration، فاسمٌ منفصل
# يجعل قاعدة هذه البوابة قاعدتها وحدها فلا يكون فشلها اصطداماً بمخطّط وظيفة
# أخرى.
#
# ما يبقى in-memory هنا بإعلان صريح: محرّك الطلبات والعملاء والتوزيع
# والمطابقة والهوية والجغرافيا. أسئلة متانتها تملكها بواباتها (04 و06 و07)،
# وتكرارها هنا يضاعف سطح الفشل دون أن يضيف معلومة. والأهم: مخزن المحرّك
# **in-memory بقصد وظيفي** لا تخفيفاً — المسار الرابع يُغلق مُستمعه ثمّ يرفعه
# على المنفذ نفسه، ويجب أن يعود حاملاً الطلبات نفسها، وذاك ما تُتيحه مخازن
# تعمّر أطول من المُستمع. الخدمات كلّها هي الإنتاجية نفسها عبر HTTP على منافذ
# عشوائية، ومنفذا التفاوض الخارجان يُبنيان بـ configuredDispatchOffers و
# configuredAgreedPrice — الدالّتان نفسهما التي يناديهما src/http/server.ts.
#
# قاعدة مستقلة (wasla_negotiation_e2e) حتى لا تتداخل مع
# negotiations-db-integration وليبقى الفشل منسوباً لوظيفة واحدة.
#
# التفصيل: docs/12-testing/PHASE08_EXIT_GATE_E2E.md
# ──────────────────────────────────────────────────────────────
negotiations-exit-gate-e2e:
  extends: .db-integration-base
  services:
    - name: postgres:15
      alias: postgres
      variables:
        POSTGRES_DB: wasla_negotiation_e2e
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
  variables:
    NEGOTIATION_DATABASE_URL: "postgres://postgres:postgres@postgres:5432/wasla_negotiation_e2e"
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter @wasla/negotiation-e2e test

# السمعة والاحتيال (المرحلة 09 · MR 3/6): يطبّق العقد الكنسي
# services/reputation/contracts/schema.sql على قاعدة نظيفة، ثمّ يشغّل ثلاث حزم
# تكامل لا تُغني الذاكرة عن أيٍّ منها:
#   • repository.integration.test.ts — كل منفذ على صفوف حقيقية، ونسخة القواعد 1
#     مقروءةً من **بذرة الترحيل** لا من ثابتٍ في الشيفرة، واثنا عشر تأكيداً
#     لاسم القيد المكسور كما يُسمّيه المحرّك.
#   • atomicity.integration.test.ts — الوقائع والدرجات وصندوق الصادر في معاملة
#     واحدة: فشلٌ بعد الكتابة يترك الجداول الثلاثة كما كانت، لا سطراً واحداً.
#   • port-conformance.integration.test.ts — نفس الاختبارات على المُهيئين معاً:
#     خمسة عشر قيداً يُرفض كلٌّ منها **بنفس الاسم** في الذاكرة وفي Postgres،
#     وسيناريو كامل يُشغَّل مرّتين وتُقارَن صفوفه حرفياً.
#
# وهذه الوظيفة هي ما يمنع الانحراف الصامت: مرآة Drizzle تُقارَن بالعقد في الحزمة
# السريعة (schema-drift.test.ts بلا قاعدة)، أمّا أنّ المحرّك نفسه يقبل ما تقبله
# المرآة ويرفض بالأسماء المُعلَنة فلا يُثبته إلا Postgres حقيقي. وبلا القاعدة
# تبقى الذاكرة كذبةً مفيدة: مئة اختبارٍ أخضر لا يقول أيٌّ منها إنّ الإنتاج
# سيقبل الصف.
#
# قاعدة مستقلّة (wasla_reputation_test) حتى لا تتداخل جداولها مع خدمة أخرى
# وليبقى الفشل منسوباً لوظيفة واحدة. والمتغيّر DATABASE_URL هو ما تقرأه
# vitest.integration.config.ts؛ وبغيابه تُتخطّى الحزم الثلاث بكاملها (skipIf)
# بلا تأكيداتٍ زائفة تُخفي أنّ القاعدة لم تُرفَع.
reputation-db-integration:
  extends: .db-integration-base
  services:
    - name: postgres:15
      alias: postgres
      variables:
        POSTGRES_DB: wasla_reputation_test
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
  variables:
    DATABASE_URL: "postgres://postgres:postgres@postgres:5432/wasla_reputation_test"
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter @wasla/reputation-service test:integration

# الاشتراك والإحالة (المرحلة 10 · MR 3/6): يطبّق العقد الكنسي
# services/subscriptions/contracts/schema.sql على قاعدة نظيفة عبر المُهاجرة نفسِها
# (applySubscriptionSchema)، لا عبر ملفٍّ ثانٍ يُعاد كتابته باليد، ثمّ يشغّل حزمتَي
# تكامل لا تُغني الذاكرة عن أيٍّ منهما:
#   • migrate.integration.test.ts — الجداولُ العشرةُ موجودةٌ فعلاً بأسماء قيودها كما
#     يُسمّيها المحرّك، وبذرةُ الكتالوج تُقارَن حقلاً حقلاً بـ LAUNCH_PLAN مقروءةً من
#     القاعدة (لا رقمَ واحداً يُعاد كتابته في INSERT)، وإعادةُ الترحيل لا تُضاعف صفّاً.
#   • ledger.integration.test.ts — مطابقةُ الاشتقاق: deriveState على صفوفٍ قُرئت من
#     Postgres يساوي deriveState على مسوّداتٍ في الذاكرة، والتجديدُ يُضيف مدةً ولا
#     يُضيف انتقالاً (القرار 3)، و`active → active` والإنشاءُ إلى غير trial ومرجعُ
#     الدفعِ في غير موضعه تُرفض **في القاعدة** بنفس رموز المجال.
#
# ولمَ وظيفةٌ بقاعدةٍ حقيقية والحزمةُ السريعةُ فيها حارسُ انحرافٍ بلا قاعدة؟ لأنّ
# schema-drift.test.ts يقارن المرآةَ بنصِّ العقد، وهذا يُثبت تطابقَ نصَّين لا أنّ
# المحرّكَ يقبل ما تقبله المرآة: قيدٌ مكتوبٌ في العقد بصيغةٍ يرفضها Postgres، أو اسمُ
# قيدٍ يُترجمه repository.ts ولا يُصدره المحرّك، لا يظهر إلّا هنا. وبلا هذه الوظيفة
# يبقى «الدفترُ يعمل» وعداً لا خبراً.
#
# قاعدة مستقلّة (wasla_subscriptions_test) حتى لا تتداخل جداولها مع خدمةٍ أخرى وليبقى
# الفشلُ منسوباً لوظيفةٍ واحدة. والمتغيّر DATABASE_URL هو ما يقرأه pg-harness؛ وبغيابه
# تُتخطّى الحزمتان بكاملهما (skipIf) بلا تأكيداتٍ زائفةٍ تُخفي أنّ القاعدةَ لم تُرفَع.
subscriptions-db-integration:
  extends: .db-integration-base
  services:
    - name: postgres:15
      alias: postgres
      variables:
        POSTGRES_DB: wasla_subscriptions_test
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
  variables:
    DATABASE_URL: "postgres://postgres:postgres@postgres:5432/wasla_subscriptions_test"
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter @wasla/subscriptions-service test:integration

# وظيفةُ تكاملِ السوقِ (المرحلة 11 · المراجعة 4/6).
#
# ولمَ لم تكن موجودةً قبل اليوم؟ لأنّ المراجعاتَ 1–3 كتبت المخزنَ واختباراتِه ولم تصل إلى
# حدٍّ يُنادى، فبقيت حزمةُ `test:integration` في السوقِ تعمل على أجهزةِ المُطوّرين ولا يقرؤها
# خطُّ التسليم. وهذا يعني — بصراحةٍ تُسجَّل — أنّ 44 اختبارَ تكاملٍ من المراجعاتِ الثلاثِ
# السابقةِ لم تكن مفحوصةً في CI قطّ؛ وهذه الوظيفةُ تُدخلها كلَّها مع الخمسينَ الجديدة.
#
# والحزمةُ تشمل `http.integration` (التسعَ عشرةَ عمليّةً على قاعدةٍ حقيقيّة) و
# `idempotency-replay.integration` (المساراتُ العشرُ الكاتبةُ: نفسُ المفتاحِ ⇒ نفسُ الحقولِ،
# ومفتاحٌ مُعادٌ لمُدخلٍ آخرَ ⇒ 409). وبغياب DATABASE_URL تتخطّى الملفّاتُ نفسَها (skipIf)
# فيبقى `pnpm -r test` أخضرَ على جهازٍ بلا قاعدة — ولذلك وجودُ هذه الوظيفةِ هو ما يجعل
# الاختباراتَ حرساً لا نيّةً.
#
# قاعدةٌ مستقلّةٌ (wasla_marketplace_test) حتى لا تتداخل صفوفُها مع وظيفةٍ أخرى ويبقى الفشلُ
# منسوباً لوظيفةٍ واحدة. و`postgres:15` هنا مقابلَ 18 على جهازِ التطوير: فرقٌ **مُعلَنٌ** في
# سجلِّ العمل لا مكتومٌ — لا قيدَ ولا دالّةَ في هذه الخدمةِ تعتمد ميزةً بعد 15، وحين يُرفَّع
# الأساسُ تُرفَّع كلُّ الوظائفِ معاً في مراجعةٍ تملكه.
marketplace-db-integration:
  extends: .db-integration-base
  services:
    - name: postgres:15
      alias: postgres
      variables:
        POSTGRES_DB: wasla_marketplace_test
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
  variables:
    DATABASE_URL: "postgres://postgres:postgres@postgres:5432/wasla_marketplace_test"
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter @wasla/marketplace-service test:integration

# بوابةُ خروج المرحلة 10 (MR 6/6):
#   packages/subscription-e2e/src/__tests__/phase10-exit-gate.e2e.test.ts
#
# ترفع خدمةَ الاشتراكِ على Postgres بتركيبِها الإنتاجيّ (createSubscriptionApp في نمط
# postgres) وخدمةَ السمعةِ على مُهيئي الذاكرة، كلتاهما على مُستمعٍ حقيقيٍّ بمنفذٍ يمنحه
# النظام، وتُثبت ثلاثةَ أشياءَ لا يُثبتها اختبارُ خدمةٍ واحدة:
#   • الحالاتُ الأربعُ (trial · expired · community · active) تُبلَغ بمضيِّ الزمنِ ونبضةٍ
#     حقيقيّةٍ على قاعدةٍ حقيقيّة، والدفترُ يحمل مُدّتَين فقط لأنّ expired و community
#     تُشتقّان من فراغِ التغطيةِ ولا مُدّةَ لهما (ADR-015 القرار 2).
#   • ما يعبر الحدَّ من السمعةِ إلى الاشتراكِ هو ما أصدره محرّكُ السمعةِ **فعلاً**: الحمولةُ
#     تُقرأ من صندوقِ صادرِه لا تُكتب في الاختبار، فاسمُ حقلٍ يختلف بين الخدمتَين يسقط هنا
#     لا في مُتكامِل. وإحالةٌ بوقائعَ دون النصابِ تبقى pending ولا صفَّ مكافأةٍ لها.
#   • مفتاحٌ مُعادٌ على مُستمعٍ حقيقيٍّ يُعيد الحالةَ والجسمَ المحفوظَين حرفاً بحرف، ونفسُ
#     المفتاحِ لجسمٍ آخرَ تعارضٌ مُسمّىً لا كتابةٌ صامتة.
#
# ولمَ وظيفةٌ بقاعدةٍ لا نمطُ ذاكرةٍ كأخواتِها؟ لأنّ createSubscriptionApp في نمطِ الذاكرة
# يردّ 503 على كلِّ عمليّةٍ **عن قصد** (http-degraded يُثبته): الحالةُ تُشتقّ من دفترٍ لا
# يُعدَّل، ومُهيئُ ذاكرةٍ لدفترٍ كهذا كان سيصير نسخةً ثانيةً من القاعدةِ تُثبت ما لا يجري
# في الإنتاج. وبغياب DATABASE_URL يتخطّى الملفُّ نفسَه (skipIf) فيبقى pnpm -r test أخضرَ
# على جهازٍ بلا قاعدة — ولذلك وجودُ هذه الوظيفةِ هو ما يجعل البوابةَ بوابةً.
#
# قاعدة مستقلّة (wasla_subscription_e2e) حتى لا تتداخل صفوفُها مع
# subscriptions-db-integration وليبقى الفشلُ منسوباً لوظيفةٍ واحدة.
subscription-exit-gate-e2e:
  extends: .db-integration-base
  services:
    - name: postgres:15
      alias: postgres
      variables:
        POSTGRES_DB: wasla_subscription_e2e
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
  variables:
    DATABASE_URL: "postgres://postgres:postgres@postgres:5432/wasla_subscription_e2e"
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter @wasla/subscription-e2e test

# بوابةُ خروج المرحلة 11 (MR 6/6):
#   packages/marketplace-e2e/src/__tests__/phase11-exit-gate.e2e.test.ts
#
# ترفع خدمةَ السوقِ بتركيبِها الإنتاجيّ (createMarketplaceApp في نمط postgres) على مُستمعٍ
# حقيقيٍّ بمنفذٍ يمنحه النظام، وتُثبت خمسةَ أشياءَ لا يُثبتها اختبارُ خدمةٍ واحدة:
#   • الرحلةُ كاملةً عبرَ الشبكةِ لا عبرَ app.inject: تسجيلٌ ⇒ طلبُ مراجعةٍ ⇒ اعتمادٌ ⇒
#     طاقمٌ ⇒ منتجٌ ⇒ اعتمادُه ⇒ مخزونٌ ⇒ نشرٌ ⇒ أرشفة، والظهورُ يقلب بقلبِ شرطٍ واحد.
#   • كلُّ صفٍّ في الصادرِ يُصدَّق **غلافاً وحمولةً** على contracts/events.json المقروءِ من
#     القرصِ لا على ثابتٍ في الاختبار: مُصدِّقُ الخدمةِ يفحص data من مُسوّداتٍ مبنيّةٍ بيدٍ،
#     وهنا تُقرأ صفوفٌ كتبتها طلباتٌ حقيقيّةٌ ويُبنى الغلافُ بـenvelopeOf — دالّةِ الناقلِ
#     يومَ يُكتب. وأنواعُ الأحداثِ في الكودِ تُطابق تعريفاتِ الورقةِ بلا نوعٍ يتيمٍ ولا تعريفٍ.
#   • مفتاحٌ مُعادٌ على مُستمعٍ حقيقيٍّ يُعيد الحالةَ والحقولَ المحفوظةَ في كلّ عمقٍ (لا
#     البايتات: response_body من نوع JSONB يُعيد ترتيبَ المفاتيح — RISK-0013)، ونفسُ
#     المفتاحِ لجسمٍ آخرَ تعارضٌ مُسمّىً لا كتابةٌ صامتة.
#   • ترتيبُ حدثَينِ في معاملةٍ واحدةٍ ترتيبُ الكتابةِ لا ترتيبُ مُعرِّفٍ عشوائيّ: يُقرأ
#     created_at::text خاماً ويُوكَّد تمايزُ الطابعَينِ وأنّ أيَّهما لا يساوي now() — وهو
#     البرهانُ على سببِ الصحّةِ بعدَ عيبِ RISK-0012 لا على نتيجتِها.
#   • غيابُ الناقلِ مُثبَّتاً: بعدَ رحلةٍ كاملةٍ يبقى published_at فارغاً في كلِّ صفٍّ، ولا
#     دالّةَ ختمٍ على سطحِ المخزن. فدَينُ المرحلة 09 مُعلَنٌ، والمُعلَنُ يُثبَّت لا يُترك ظنّاً.
#
# ولمَ وظيفةٌ بقاعدةٍ لا نمطُ ذاكرةٍ؟ لأنّ createMarketplaceApp في نمطِ الذاكرة يردّ 503 على
# كلِّ عمليّةٍ **عن قصد**: الظهورُ يُشتقّ عندَ القراءةِ من دفترٍ لا يُعدَّل، ومُهيئُ ذاكرةٍ
# لدفترٍ كهذا كان سيصير نسخةً ثانيةً من القاعدةِ تُثبت ما لا يجري في الإنتاج. وبغياب
# DATABASE_URL يتخطّى الملفُّ نفسَه (skipIf) فيبقى pnpm -r test أخضرَ على جهازٍ بلا قاعدة —
# ولذلك وجودُ هذه الوظيفةِ هو ما يجعل البوابةَ بوابةً.
#
# قاعدة مستقلّة (wasla_marketplace_e2e) حتى لا تتداخل صفوفُها مع marketplace-db-integration
# وليبقى الفشلُ منسوباً لوظيفةٍ واحدة.
marketplace-exit-gate-e2e:
  extends: .db-integration-base
  services:
    - name: postgres:15
      alias: postgres
      variables:
        POSTGRES_DB: wasla_marketplace_e2e
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
  variables:
    DATABASE_URL: "postgres://postgres:postgres@postgres:5432/wasla_marketplace_e2e"
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter @wasla/marketplace-e2e test

# ───────────────────────────────────────────────────────────────────────────────
# M5-12 · المراجعة 4/N — قاعدةُ قراءةِ البحث: تكاملٌ وبوّابةُ خروج.
# ───────────────────────────────────────────────────────────────────────────────

# وظيفةُ تكاملِ البحثِ (المرحلة 12 · المراجعة 4/N).
#
# ولمَ لم تكن موجودةً قبل اليوم؟ لأنّ ADR-025 §4 أجّلها صراحةً في المراجعاتِ 1–3، فبقيت
# عشرةُ اختباراتِ تكاملٍ تُدارُ يداً على أجهزةِ المُطوّرين ولا يقرؤها خطُّ التسليم. وهي
# ليست اختباراتٍ عاديّةً تُؤجَّل بلا ثمنٍ: كلُّها يمسُّ ما **لا وجودَ له خارجَ Postgres** —
# امتدادُ pg_trgm وعتبةُ التقارب، والفهرسةُ النصيّةُ الإنجليزيّةُ، ومحوّلُ القراءةِ بجملتِه
# الفعليّةِ. وما يُدارُ يداً ليس حارساً؛ ودالّةُ ترتيبٍ تنكسر بترقيةِ صورةٍ لا يكشفها إلّا
# تشغيلٌ على قاعدةٍ في خطِّ التسليم.
#
# قاعدةٌ مستقلّةٌ (wasla_search_test) حتى لا تتداخل صفوفُها مع وظيفةٍ أخرى ويبقى الفشلُ
# منسوباً لوظيفةٍ واحدة. و`postgres:15` هنا مقابلَ 18 على جهازِ التطوير: فرقٌ **مُعلَنٌ**
# في سجلِّ العمل لا مكتومٌ.
search-db-integration:
  extends: .db-integration-base
  services:
    - name: postgres:15
      alias: postgres
      variables:
        POSTGRES_DB: wasla_search_test
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
  variables:
    DATABASE_URL: "postgres://postgres:postgres@postgres:5432/wasla_search_test"
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter @wasla/search-service test:integration

# `M5-13` · المراجعة 3/N — محوّلاتُ PostgreSQL لمستهلكِ dispatch (ADR-026 §4.2
# رفعُ التأجيل). أحد عشرَ اختباراً على قاعدةٍ حقيقيّةٍ يُثبتُ ما لا تُثبتُهُ البدائلُ
# الذهنيّةُ: الذرّيّةُ عندَ فشلٍ وسطَ المعاملةِ، ومنعُ التكرارِ بعدَ فقدانِ نقطةِ
# التقدّمِ، وعلامةُ الماءِ عبرَ دورةِ timestamptz كاملة، وأنّ المخطّطَ المطبّقَ هو
# ملفُّ العقدِ من القرص. قراءةٌ فقط من صندوقِ dispatch — لا published_at أبداً.
#
# قاعدةٌ مستقلّةٌ (wasla_delivery_test) كما في كلِّ ساقٍ حتى يبقى الفشلُ منسوباً
# لوظيفةٍ واحدة. و`postgres:15` مقابلَ 18 على جهازِ التطويرِ: فرقٌ **مُعلَنٌ**
# في سجلِّ العمل لا مكتومٌ.
delivery-db-integration:
  extends: .db-integration-base
  services:
    - name: postgres:15
      alias: postgres
      variables:
        POSTGRES_DB: wasla_delivery_test
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
  variables:
    DATABASE_URL: "postgres://postgres:postgres@postgres:5432/wasla_delivery_test"
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter @wasla/delivery-service test:integration

# بوابةُ خروج المرحلة 12 (MR 4/N):
#   packages/search-e2e/src/__tests__/phase12-exit-gate.e2e.test.ts
#
# ترفع خدمةَ البحثِ بتركيبِها الإنتاجيّ (buildSearchHttpApp فوق SearchIndexReader) على
# مُستمعٍ حقيقيٍّ بمنفذٍ يمنحه النظام، وتُبني الفهرسَ الذي يُبحَثُ فيه **بالناقلِ الإنتاجيِّ
# من صندوقِ صادرِ السوقِ**، وتُثبت خمسةَ أشياءَ لا يُثبتها اختبارُ خدمةٍ واحدة:
#   • أنّ الوثائقَ من أحداثٍ لا من INSERT: كلُّ منتجٍ في مجموعةِ الصلةِ يدخل الفهرسَ عبرَ
#     marketplace_outbox ⇒ runRelayBatch ⇒ search_product_index. فإسقاطٌ ناقصٌ يسقط هنا
#     **حُكمَ صلةٍ** لا صفَّ جدولٍ.
#   • أنّ حكمَ الصلةِ مكتوبٌ قبلَ القياسِ: ثمانيةُ أحكامٍ تُعلن لكلِّ استعلامٍ مَن يجب أن
#     يتصدّر ومَن يجب ألّا يظهر إطلاقاً — لا اختبارٌ يُصوّر ما تفعله الشيفرةُ اليومَ.
#   • أنّ الظهورَ يُعاد بناؤه من الحالةِ عندَ القراءةِ: خمسُ وثائقَ مخفيّةٍ لخمسةِ أسبابٍ
#     مختلفةٍ لا تظهر في أيِّ نتيجةٍ، ثمّ يُصفَّر مخزونُ منتجٍ ظاهرٍ بحدثٍ فيختفي **بلا
#     DELETE** ويُعاد فيعود. رايةٌ مخزَّنةٌ كانت ستنجو من هذا الاختبار.
#   • أنّ الزمنَ مقيسٌ على السلكِ لا مُقدَّرٌ: مئينيّاتٌ على فهرسٍ فيه ألفا وثيقةٍ، تسلسلاً
#     ثمّ بدفعةٍ متزامنةٍ، بنداءاتِ fetch على منفذٍ حقيقيّ. وapp.inject كان سيقيس زمنَ
#     دالّةٍ لا زمنَ خدمة.
#   • أنّ الحدَّ المُعلَنَ حدٌّ فعليٌّ: سقفُ المُرشَّحينَ 500 يُقاسُ باستعلامٍ يُطابق ألفَي
#     وثيقةٍ — ويُسجَّلُ المقيسُ في سجلِّ المخاطرِ باسمِه (RISK-0029) لا في تعليقٍ.
#
# وبغياب DATABASE_URL يتخطّى الملفُّ نفسَه (skipIf) فيبقى pnpm -r test أخضرَ على جهازٍ بلا
# قاعدة — ولذلك وجودُ هذه الوظيفةِ هو ما يجعل البوابةَ بوابةً. و`EXIT_GATE_REQUIRE_DB=1`
# يجعل التخطّي **إخفاقاً باسمِه** داخلَ هذه الوظيفةِ، فلا تُعلَنُ خضراءَ وهي لم تقس شيئاً.
#
# قاعدة مستقلّة (wasla_search_e2e) حتى لا تتداخل صفوفُها مع search-db-integration وليبقى
# الفشلُ منسوباً لوظيفةٍ واحدة.
search-exit-gate-e2e:
  extends: .db-integration-base
  services:
    - name: postgres:15
      alias: postgres
      variables:
        POSTGRES_DB: wasla_search_e2e
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
  variables:
    DATABASE_URL: "postgres://postgres:postgres@postgres:5432/wasla_search_e2e"
    EXIT_GATE_REQUIRE_DB: "1"
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter @wasla/search-e2e test

# ─────────────────────────────────────────────────────────────────────────────
# `M5-13` · بوّابةُ خروجِ الطورِ 13 — مرآةُ الدفعِ والتأكيدُ على **خدمتَينِ حقيقيَّتَينِ**
#   packages/delivery-e2e/src/__tests__/phase13-exit-gate.e2e.test.ts
#
# هذه البوّابةُ وحدَها ترفعُ مُستمعَينِ: تطبيقَ السوقِ وتطبيقَ التوصيلِ، على قاعدةٍ
# واحدةٍ بمخطَّطَيهما، ثمَّ تُنادي بينهما بـ`fetch` على منفذَينِ. وما تُثبتُهُ ولا
# يُثبتُهُ اختبارُ وحدةٍ ولا تكاملٍ:
#   • أنَّ لقطةَ السعرِ تُؤخَذُ من السوقِ الحقيقيِّ بـ`store_slug` (§4.11)، فمنتجٌ
#     مسودّةٌ يُرفَضُ رفضاً دائماً 400-class **والسوقُ هوَ من قالَ ذلك** — لا مُزيَّفٌ.
#   • أنَّ الشوطَ `placed → confirmed` مقطوعٌ فعلاً: مرآةُ دفعٍ ثمَّ تأكيدٌ، ودفترُ
#     الانتقالاتِ بمحورَيهِ الثلاثةِ صفوفٍ.
#   • أنَّ كلَّ حدثٍ في الصندوقِ يُطابقُ `contracts/events.json` المنشورَ، و`published_at`
#     فيها NULL: لا ناقلَ يختمُ ما لم يُرسَلْ.
#   • أنَّ حدثَ مخزونٍ **كتبَهُ السوقُ** يعبرُ الناقلَ إلى دفترِ التوصيلِ.
#   • أنَّ الجوابَ المحفوظَ يصمدُ بايتاً ببايتٍ **على الشبكةِ** مع `Idempotent-Replay: true`،
#     وأنَّ نفسَ المفتاحِ بجسمٍ آخرَ 409 — وهوَ ما لا يقيسُهُ `app.inject`.
#
# وأوّلُ تشغيلٍ لها كشفَ عطبَينِ حقيقيَّينِ مرَّا من 209 اختبارِ وحدةٍ و48 تكاملٍ: قيدُ
# `route` في المخطَّطِ ناقصاً مسارَينِ (500 على طلبٍ صحيحٍ)، و`content-type: application/json`
# بجسمٍ فارغٍ على مسارٍ لا جسمَ لهُ (500 يُسمّي طلبَ العميلِ عطبَنا).
#
# قاعدةٌ مستقلّةٌ (wasla_delivery_e2e) كي لا تتداخلَ صفوفُها مع delivery-db-integration،
# و`EXIT_GATE_REQUIRE_DB=1` يجعلُ التخطّيَ إخفاقاً باسمِهِ داخلَ الوظيفةِ.
delivery-exit-gate-e2e:
  extends: .db-integration-base
  services:
    - name: postgres:15
      alias: postgres
      variables:
        POSTGRES_DB: wasla_delivery_e2e
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
  variables:
    DATABASE_URL: "postgres://postgres:postgres@postgres:5432/wasla_delivery_e2e"
    EXIT_GATE_REQUIRE_DB: "1"
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter @wasla/delivery-e2e test

# .gitlab-ci.yml — WASLA validation pipeline
# Stages: validate (بنية المستودع/الأسرار/الوثائق) + build (typecheck/test).
# shared runners مُفعّلة (2026-08-20) وكل الوظائف تنفّذ فعلياً على main وعلى MRs.

stages:
  - validate
  - build

variables:
  GIT_DEPTH: "1"

# ─────────────────────────────────────────────────────────────────────
# بنيةُ المستودعِ الإلزاميّة — **بلا قائمةٍ مضمَّنةٍ هنا** (M0-04).
# كانت هذه الوظيفةُ تكتب قائمةَ الملفّاتِ والأدلّةِ داخلَ `script:`، فصارت
# نسخةً ثانيةً تفارق `REQUIRED_DOCS` في البوّابةِ بـ12 عنصراً — ولا يمكن
# تشغيلُها محلّياً. المصدرُ الواحدُ الآنَ: scripts/checks/lib/required-artifacts.sh
# ويحرس رجوعَ الكتلةِ المضمَّنةِ: scripts/checks/validate-ci-mandatory.sh (البابُ 2).
# المرجع: docs/00-rules/VERIFY_COMMAND.md §2
# ─────────────────────────────────────────────────────────────────────
repo-structure:
  stage: validate
  image: alpine:3.20
  before_script:
    - apk add --no-cache bash python3
  script:
    - bash scripts/checks/validate-repo-structure.sh
    - bash scripts/checks/validate-launch-board.sh
    - bash scripts/checks/validate-work-claims.sh
    - bash scripts/checks/scan-secrets.sh

# فحص قواعد Markdown (اختياري — يتجاهل إذا لم تتوفر الأداة).
markdown-lint:
  stage: validate
  image: alpine:3.20
  allow_failure: true
  before_script:
    - apk add --no-cache nodejs npm
    - npm install -g markdownlint-cli2 || true
  script:
    - |
      if command -v markdownlint-cli2 >/dev/null 2>&1; then
        markdownlint-cli2 "README.md" "CONTRIBUTING.md" "SECURITY.md" "docs/**/*.md" || true
      else
        echo "markdownlint-cli2 غير متوفر، تخطي الفحص (allow_failure)"
      fi

# ─────────────────────────────────────────────────────────────────────
# قاعدة التوثيق مع كل دفع (PUSH_DOCUMENTATION_RULE).
# إلزام خادمي: أي MR يمس الكود يجب أن يلمس docs/ أيضاً. وإلا FAIL.
# ─────────────────────────────────────────────────────────────────────
doc-coverage:
  stage: validate
  image: alpine:3.20
  before_script:
    - apk add --no-cache bash git
    - |
      TARGET="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-${CI_DEFAULT_BRANCH:-main}}"
      git fetch origin "$TARGET:refs/remotes/origin/$TARGET" --depth=50 2>/dev/null || true
  script:
    - |
      TARGET="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-${CI_DEFAULT_BRANCH:-main}}"
      bash scripts/checks/require-doc-update.sh "origin/$TARGET" HEAD
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ─────────────────────────────────────────────────────────────────────
# بوابة الحوكمة الموحّدة — منع تكرار العمل بين جهتين.
# تُنفّذ verify-governance.sh: لوحة + حجوزات نطاق + قاعدة التوثيق + بياتُ الحجوزات
# (M0-16) + هدفُ طلبِ الدمج (M0-17) + أسرار + عزلُ DDL في اختباراتِ التكامل (M0-03)
# — سبعةُ فحوصٍ.
# ثم تُشغّل test-governance.sh لتُثبت أن الفحوص ترفض فعلاً لا شكلاً.
# المرجع: docs/00-rules/WORK_CLAIM_RULE.md · docs/16-progress/README.md
# ─────────────────────────────────────────────────────────────────────
# العيبُ الكامنُ نفسُه (ADR-023 §6) — نسخةٌ ثانيةٌ منه: بوّابةُ الحوكمةِ
# تشملُ الفحصَ 11 (أساسُ M0-08) وهو يقرأُ `pnpm --version`. صُحِّح في M0-22B.
governance-guard:
  stage: validate
  image: node:20-alpine
  variables:
    GIT_DEPTH: "50"
  before_script:
    - apk add --no-cache bash git python3 coreutils findutils grep sed
    - corepack enable
    - corepack prepare pnpm@9 --activate
    # (CLM-0523) نظيرُ خطوةِ install في ci.yml: الحارسُ 28 يحتاجُ `typescript`.
    - pnpm install --frozen-lockfile
    - |
      TARGET="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-${CI_DEFAULT_BRANCH:-main}}"
      git fetch origin "$TARGET:refs/remotes/origin/$TARGET" --depth=50 2>/dev/null || true
  script:
    - |
      TARGET="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-${CI_DEFAULT_BRANCH:-main}}"
      echo "==> بوابة الحوكمة: النطاق origin/$TARGET..HEAD"
      bash scripts/checks/verify-governance.sh "origin/$TARGET" HEAD
    - |
      echo "==> إثبات أن الفحوص ترفض فعلاً (عدد الحالات يُطبَع في ذيل الحزمة)"
      bash scripts/checks/test-governance.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ─────────────────────────────────────────────────────────────────────
# بناء واختبار (Phase 00 build/test foundation — ADR-003).
# يتطلب Node 20 + pnpm 9 (عبر corepack). ينفّذ typecheck و test لكل الحزم.
# ─────────────────────────────────────────────────────────────────────
build-test:
  stage: build
  image: node:20-alpine
  before_script:
    - corepack enable
    - corepack prepare pnpm@9 --activate
  script:
    - pnpm install --frozen-lockfile
    - pnpm -r run typecheck
    # مصدرُ استدعاءٍ واحدٌ (`M0-35`) — لا `pnpm -r run test` مباشرةً.
    - bash scripts/run-tests.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ─────────────────────────────────────────────────────────────────────
# اختبارات تكامل Postgres (Phase 01 MR 4 + Phase 02 MR 6).
# قاعدة مشتركة: node:20-alpine + pnpm 9 + تثبيت مُجمّد. كل خدمة تملك وظيفتها
# وقاعدة بياناتها المستقلّة حتى يكون الفشل مُنسَباً لخدمة واحدة ولا تتداخل
# جداول خدمة مع أخرى. الاختبارات نفسها تُطبّق `contracts/schema.sql` الكنسي.
# منفصلة عن build-test (الذي لا يحتاج DB) حتى يبقى الافتراضي أخضر دون قاعدة.
# ─────────────────────────────────────────────────────────────────────
.db-integration-base:
  stage: build
  image: node:20-alpine
  before_script:
    - corepack enable
    - corepack prepare pnpm@9 --activate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"


# ─────────────────────────────────────────────────────────────────────
# الأمرُ الموحَّد (M0-04) — نفسُ ما يشغّله المطوّرُ بـ`pnpm verify`.
# لا وظيفةَ تفحص شيئاً لا يقدر عليه المطوّرُ محلّياً، ولا فحصٌ محلّيٌّ لا يجري هنا.
# الأنواعُ والاختباراتُ تُتخطّى هنا **بوسمٍ صريحٍ في الأرتفاكت** لأنّ وظائفَ
# build-test وdb-integration تُشغّلها باعتمادياتٍ وقاعدةٍ حقيقيّة.
# والأرتفاكتُ يُرفَع `when: always` — فالتقريرُ يُقرأ عندَ الإخفاقِ خاصّةً.
# المرجع: docs/00-rules/VERIFY_COMMAND.md §6
# ─────────────────────────────────────────────────────────────────────
# عيبٌ كامنٌ صُحِّح في M0-22B (ADR-023 §6): كانت الصورةُ `alpine:3.20` بلا
# node ولا pnpm، فيقرأ `scripts/verify.sh` الحقلَ `env.pnpm` فارغاً ويُخفقُ
# أساسُ M0-08. ولم يُكتشَف العيبُ سنةً كاملةً **لأنّ الوظيفةَ لم تبدأ قطُّ**
# (الحصّةُ منتهيةٌ منذ 2026-08-25) — فالأحمرُ الذي لا يجري لا يُعلِّمُ شيئاً.
# كشفَه أوّلُ تشغيلٍ حقيقيٍّ على GitHub، فصُحِّح هنا أيضاً حفاظاً على تكافؤِ
# الملفَّين. والصورةُ صارت `node:20-alpine` لأنّ الحقلَ يحتاج المُفسِّرَ نفسَه
# لا محاكاةً له. و`VERIFY_SKIP_NODE` باقٍ: الأنواعُ والاختباراتُ لبناءٍ آخر.
verify:
  stage: validate
  image: node:20-alpine
  variables:
    VERIFY_SKIP_NODE: "1"
  before_script:
    - apk add --no-cache bash git python3 grep
    - corepack enable
    - corepack prepare pnpm@9 --activate
  script:
    - bash scripts/verify.sh
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - artifacts/verify/

# Identity (Phase 01 Exit Gate persistence verification):
# services/identity/src/__tests__/postgres-repository.integration.test.ts
# ملفّانِ يُسقطان جداولَ القاعدةِ نفسِها في `beforeAll`، و`vitest.integration.config.ts`
# يُسلسلُهما بـ`fileParallelism: false` (M0-03 — والفحصُ 7 في البوّابةِ يحرسُ هذا).
db-integration:
  extends: .db-integration-base
  services:
    - name: postgres:15
      alias: postgres
      variables:
        POSTGRES_DB: wasla_test
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
  variables:
    DATABASE_URL: "postgres://postgres:postgres@postgres:5432/wasla_test"
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter @wasla/identity-service test:integration

# Geography (Phase 02): يُطبّق schema.sql + بيانات السعودية الأولية ويتحقّق من
# التسلسل الهرمي المُترجم و fallback إلى ar وتعيين/تغيير الموقع + history + outbox:
# services/geography/src/__tests__/postgres-repository.integration.test.ts
geography-db-integration:
  extends: .db-integration-base
  services:
    - name: postgres:15
      alias: postgres
      variables:
        POSTGRES_DB: wasla_geo_test
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
  variables:
    DATABASE_URL: "postgres://postgres:postgres@postgres:5432/wasla_geo_test"
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter @wasla/geography-service test:integration

# طبقة القنوات (Phase 03 MR 5): تُطبّق packages/channel-core/contracts/schema.sql
# وتتحقّق من مُهيّئات Postgres للمنافذ الثلاثة (channel_updates / channel_deliveries /
# channel_outbox) + مطابقة سلوكها لمُهيّئات in-memory عبر حالات الاستخدام نفسها:
#   packages/channel-postgres/src/__tests__/stores.integration.test.ts
#   packages/channel-postgres/src/__tests__/port-conformance.integration.test.ts
channel-db-integration:
  extends: .db-integration-base
  services:
    - name: postgres:15
      alias: postgres
      variables:
        POSTGRES_DB: wasla_channel_test
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
  variables:
    DATABASE_URL: "postgres://postgres:postgres@postgres:5432/wasla_channel_test"
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter @wasla/channel-postgres test:integration

# العملاء (المرحلة 04 · MR 3/6): يُطبّق services/customers/contracts/schema.sql
# ثم يُشغّل ملفَّين:
#   - postgres-repository.integration.test.ts: المحوّل نفسه أمام قاعدة حقيقية
#     (NUMERIC كأرقام، الحقول الغائبة تبقى غائبة، قيود CHECK، معاملة واحدة
#     للطلب ونقاطه، أخطاء التكرار بالرسائل نفسها).
#   - port-conformance.integration.test.ts: السيناريو نفسه يُنفَّذ مرّتين، مرّة
#     بمحوّلات in-memory ومرّة بـ Postgres، والنتيجة والأحداث يجب أن تتطابق.
#     هذه هي الوظيفة التي تُثبت أنّ إضافة قاعدة البيانات لم تُغيّر أي سلوك.
# قاعدة منفصلة (wasla_customer_test) ليبقى الفشل منسوباً لوظيفة واحدة.
customer-db-integration:
  extends: .db-integration-base
  services:
    - name: postgres:15
      alias: postgres
      variables:
        POSTGRES_DB: wasla_customer_test
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
  variables:
    DATABASE_URL: "postgres://postgres:postgres@postgres:5432/wasla_customer_test"
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter @wasla/customers-service test:integration

# الطلبات (المرحلة 06 · MR 3/6): يُطبّق services/orders/contracts/schema.sql
# (5 جداول + متتالية order_public_id_seq + قيد ربط الحالة بالإسناد
# ck_orders_assignment_matches_status) ثم يُشغّل أربعة ملفّات:
#   - schema-drift.test.ts: حرّاس انحراف يقرأون schema.sql فعلياً ويتحققون أنّ
#     إسقاط Drizzle يتطابق مع العقود (لا فهارس إضافية، لا أعمدة إضافية، لا
#     روابط خارجية إلى الهوية/الجغرافيا/السائقين).
#   - postgres-repository.integration.test.ts: المحوّل نفسه أمام قاعدة حقيقية
#     (NUMERIC كأرقام، الحقول الغائبة تبقى غائبة، قيود CHECK و FK، أخطاء
#     التكرار بالرسائل نفسها، متتالية المعرّف العلني).
#   - atomicity.integration.test.ts: يُثبت أنّ الكتابة الثلاثية (الحالة +
#     التدقيق + الحدث) ترتكز أو تتراجع كوحدة واحدة — دَينٍ كان مفتوحاً في
#     خدمة العملاء، يُسدّه هنا PostgresOrderUnitOfWork. الاختبار الحاسم:
#     فشل بعد رجوع use case → order + audit + outbox الحقيقي كلها غائبة.
#   - port-conformance.integration.test.ts: السيناريو نفسه يُنفَّذ مرّتين، مرّة
#     بمحوّلات in-memory ومرّة بـ Postgres داخل Unit of Work باستخدام outbox
#     حقيقي، والنتيجة والأحداث يجب أن تتطابق. هذه هي الوظيفة التي تُثبت أنّ
#     إضافة قاعدة البيانات وطبقة الذرّية لم تُغيّر أي سلوك.
# قاعدة منفصلة (wasla_orders_test) ليبقى الفشل منسوباً لوظيفة واحدة.
order-db-integration:
  extends: .db-integration-base
  services:
    - name: postgres:15
      alias: postgres
      variables:
        POSTGRES_DB: wasla_orders_test
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
  variables:
    DATABASE_URL: "postgres://postgres:postgres@postgres:5432/wasla_orders_test"
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter @wasla/orders-service test:integration

# المطابقة (المرحلة 07 · MR 3/6): يُطبّق services/matching/contracts/schema.sql
# (6 جداول — بعد أن أضاف هذا الـ MR جدول matching_idempotency لأنّ منفذ
# IdempotencyStore لم يكن له مخزن في العقد — ومعها بذرة نسخة القواعد 1
# المُقفَلة) ثم يُشغّل ثلاثة ملفّات:
#   - postgres-repository.integration.test.ts: ما لا يُثبته إلّا محرّك حقيقي —
#     أنّ قيود CHECK مُطبَّقة فعلاً (نسبة قبول أعلى من واحد، عدّادات غير
#     متصاعدة، نتيجة فارغة بلا سبب، رتبة مكرّرة داخل قرار واحد، أوزان لا
#     تجمع 100)، وأنّ الفهارس الجزئية موجودة، وأنّ TEXT[]/UUID[]/TIMESTAMPTZ
#     تعود كما دخلت، وأنّ نسخة قواعد غير مُقفَلة لا تُعاد كالنشطة أبداً.
#   - atomicity.integration.test.ts: يُثبت أنّ الكتابة الثلاثية (الصف + مفتاح
#     عدم التكرار + الحدث) ترتكز أو تتراجع كوحدة واحدة. الاختبار الحاسم:
#     نُفشِل outbox.append بعد نجاح candidacy.replace ثم نتحقق بـ SQL مباشر
#     أنّ الصف والمفتاح والحدث كلها غائبة — فمفتاحٌ باقٍ بلا حدث يجعل إعادة
#     محاولة العميل تُرفض كتكرار والتغيير لا يُنشر أبداً.
#   - port-conformance.integration.test.ts: السيناريو نفسه يُنفَّذ مرّتين، مرّة
#     بمحوّلات in-memory ومرّة بـ Postgres، والنتيجتان تُقارَنان إحداهما
#     بالأخرى لا بتوقّع مكتوب بيد. هذه هي الوظيفة التي تُثبت أنّ إضافة قاعدة
#     البيانات لم تُغيّر أي سلوك ولم تُعدّل ملفاً واحداً في src/use-cases/.
# حارس انحراف المرآة (schema-drift.test.ts) يعمل في build-test بلا قاعدة، لأنّه
# يقرأ schema.sql من القرص ويقارنه بإسقاط Drizzle.
# قاعدة منفصلة (wasla_matching_test) ليبقى الفشل منسوباً لوظيفة واحدة.
matching-db-integration:
  extends: .db-integration-base
  services:
    - name: postgres:15
      alias: postgres
      variables:
        POSTGRES_DB: wasla_matching_test
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
  variables:
    DATABASE_URL: "postgres://postgres:postgres@postgres:5432/wasla_matching_test"
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter @wasla/matching-service test:integration

# التوزيع (المرحلة 07 · MR 5a/6): يُطبّق services/dispatch/contracts/schema.sql
# (5 جداول — بعد أن أضاف هذا الـ MR جدول dispatch_idempotency لأنّ منفذ
# IdempotencyStore لم يكن له مخزن في العقد؛ ولا بذور تعاقدية في هذه الخدمة،
# فالقواعد تصل عبر منفذ RulesProvider لا عبر جدول) ثم يُشغّل ثلاثة ملفّات:
#   - repository.integration.test.ts: ما لا يُثبته إلّا محرّك حقيقي — أنّ
#     الفهرسين الجزئيين مُطبَّقان فعلاً (موجة واحدة مفتوحة للمهمة، وقبول واحد
#     للمهمة)، وأنّ نفس السائق لا يُعرَض عليه مرّتين في مهمة واحدة عبر الموجات،
#     وأنّ مصفوفة الطوابع الزمنية وترتيب المُهَل مُلزِمة، وأنّ الحذف يتشلشل
#     من المهمة إلى موجاتها وعروضها، وأنّ TIMESTAMPTZ يعود نصّاً ISO كما دخل.
#   - atomicity.integration.test.ts: يُثبت أنّ نبضة واحدة (صفّ الموجة + صفوف
#     العروض + حالة المهمة + الأحداث) ترتكز أو تتراجع كوحدة واحدة. الاختبار
#     الحاسم: نُفشِل outbox.append بعد نجاح waves.insert وoffers.insert ثم
#     نتحقّق أنّ الموجة والعروض والأحداث كلها غائبة — فموجة «مفتوحة» بلا عروض
#     تجعل ux_dispatch_waves_one_open_job يرفض كل موجة تالية لتلك المهمة، وهو
#     تعطّل دائم لا تُصلحه إعادة المحاولة بل حذف بشري لصفّ.
#   - port-conformance.integration.test.ts: السيناريو نفسه يُنفَّذ مرّتين، مرّة
#     بمحوّلات in-memory ومرّة بـ Postgres، والنتيجتان تُقارَنان إحداهما
#     بالأخرى لا بتوقّع مكتوب بيد. هذه هي الوظيفة التي تُثبت المعيار المُعلَن
#     مسبقاً: إضافة قاعدة البيانات لم تُغيّر أي سلوك، والاستثناء الوحيد
#     (updated_at، يملكه المُشغّل trg_*_updated_at) موثّق في
#     docs/02-architecture/DISPATCH_PERSISTENCE.md §4.
# حارس انحراف المرآة (schema-drift.test.ts) يعمل في build-test بلا قاعدة، لأنّه
# يقرأ schema.sql من القرص ويقارنه بإسقاط Drizzle في الاتجاهين، ويتحقّق أيضاً
# أنّ كل اسم قيد يذكره تعليق في محوّلي التخزين موجود فعلاً في العقد.
# قاعدة منفصلة (wasla_dispatch_test) ليبقى الفشل منسوباً لوظيفة واحدة.
dispatch-db-integration:
  extends: .db-integration-base
  services:
    - name: postgres:15
      alias: postgres
      variables:
        POSTGRES_DB: wasla_dispatch_test
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
  variables:
    DATABASE_URL: "postgres://postgres:postgres@postgres:5432/wasla_dispatch_test"
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter @wasla/dispatch-service test:integration

# ──────────────────────────────────────────────────────────────
# السائقون (المرحلة 05 · MR 3/6): يُطبّق services/drivers/contracts/schema.sql
# (9 جداول — بعد أن أضاف هذا الـ MR جدول driver_idempotency لأنّ منفذ
# IdempotencyStore لم يكن له مخزن في العقد، بعرض 8..192 لا 8..128 لأنّ المفتاح
# المخزون فيه مُنطَّق: vehicle:WS-XXXXXXXXXX:<key>، والحسبة في §9 من العقد).
# على خلاف التوزيع، هذه الخدمة تحمل بذرة تعاقدية: سياسة الأهليّة الإصدار 1
# (saudi-launch-v1، مُجمَّدة) تُزرع في الـ DDL نفسه ويقرأها الحاسب كلّه عبر
# EligibilityPolicyRepository.findActive()، فـ resetData يُفرغ الجداول الثمانية
# الأخرى ويستثني driver_eligibility_policies — تفريغه يجعل كل تسجيل تالٍ
# يفشل بـ policyNotFound، وهو فشل أخضر يُثبت أنّ التسجيل لا يعمل لا أنّه يعمل.
# ثلاثة ملفّات تعمل هنا:
#   - repository.integration.test.ts: ما لا يُثبته إلّا محرّك حقيقي — أنّ
#     الفهرسين الجزئيين مُطبَّقان فعلاً (مركبة أساسيّة واحدة، ووثيقة حيّة واحدة
#     لكل نوع)، وأنّ COALESCE إلى الـ UUID الصفري في
#     ux_driver_documents_one_live_per_type هو ما يمنع وثيقتَي هويّة حيّتين
#     (فـ NULL يختلف عن NULL في فهرس فريد)، وأنّ أعمدة DATE تعود يوماً
#     تقويميّاً "YYYY-MM-DD" لا طابعاً زمنيّاً — وإلّا انسحب توقيت الخادم إلى
#     انتهاء رخصة، وخسر سائق في المدينة أهليّته بثلاث ساعات مبكّراً — وأنّ
#     ترتيب listDueForRecheck (فهرس نبضة الانتهاء) مُلزِم، وأنّ 23505 يُترجَم
#     إلى خطأ مجال مُسمّى لا إلى 500 يحمل نصّ Postgres.
#   - atomicity.integration.test.ts: يُثبت أنّ عمليّة واحدة (تجاوز الوثيقة
#     الحيّة + صفّ الوثيقة الجديد + سجلّ الأهليّة + صفّ النشر + الأحداث)
#     ترتكز أو تتراجع كوحدة واحدة. الأخطر بين البادئات المُحتملة هو صفّ
#     driver_idempotency بلا صفوف خلفه: إعادة المحاولة تُجاب «تمّ من قبل» من
#     صفّ لا وجود له، فيضيع العمل ضياعاً دائماً لا يُصلحه طلب لاحق.
#   - port-conformance.integration.test.ts: السيناريو نفسه يُنفَّذ مرّتين، مرّة
#     بمحوّلات in-memory ومرّة بـ Postgres، والنتيجتان تُقارَنان إحداهما
#     بالأخرى لا بتوقّع مكتوب بيد. هذه هي الوظيفة التي تُثبت المعيار المُعلَن
#     مسبقاً: إضافة قاعدة البيانات لم تُغيّر أي سلوك، ولم يتغيّر أي ملفّ في
#     src/use-cases/. والاستثناء الوحيد (updated_at، يملكه المُشغّل
#     trg_driver_*_updated_at) موثّق في
#     docs/02-architecture/DRIVER_PERSISTENCE.md §5.
# حارس انحراف المرآة (schema-drift.test.ts) يعمل في build-test بلا قاعدة، لأنّه
# يقرأ schema.sql من القرص ويقارنه بإسقاط Drizzle في الاتجاهين، ويتحقّق أيضاً
# أنّ كل اسم قيد يذكره تعليق أو فرع في محوّلي التخزين موجود فعلاً في العقد —
# والاسم المُخطئ في repository.ts فرعُ switch لا يعمل أبداً، فيجيب واجهة 500
# حيث وعدت بـ 409.
# قاعدة منفصلة (wasla_drivers_test) ليبقى الفشل منسوباً لوظيفة واحدة.
# ──────────────────────────────────────────────────────────────
drivers-db-integration:
  extends: .db-integration-base
  services:
    - name: postgres:15
      alias: postgres
      variables:
        POSTGRES_DB: wasla_drivers_test
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
  variables:
    DATABASE_URL: "postgres://postgres:postgres@postgres:5432/wasla_drivers_test"
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter @wasla/drivers-service test:integration

# ──────────────────────────────────────────────────────────────
# بوابة خروج المرحلة 03 (MR 7) — البوتات الثلاثة + خدمة الهوية عبر HTTP
# حقيقي + مخازن Postgres في عملية واحدة:
#   packages/channel-e2e/src/__tests__/phase03-exit-gate.e2e.test.ts
#
# الاختبار نفسه يعمل أيضاً داخل build-test بمخازن in-memory (فالبوابة يجب أن
# تُثبَت على كل MR دون قاعدة بيانات)؛ هذه الوظيفة تضيف ما لا يُثبته إلّا
# محرّك حقيقي: أن فهرس عدم التكرار يشمل البوت فعلاً، وأن صفّ التسليم
# المحفوظ يحمل زر Mini App الخاص بكل بوت. قاعدة مستقلة (wasla_channel_e2e)
# حتّى لا تتداخل مع channel-db-integration وليبقى الفشل منسوباً لوظيفة واحدة.
# خدمة الهوية تعمل داخل الاختبار بمحوّلات in-memory وتستمع على منفذ عشوائي،
# فلا تحتاج مخطّط identity_* هنا (محلّ الفحص هو العقد بين الخدمتين).
# ──────────────────────────────────────────────────────────────
channel-exit-gate-e2e:
  extends: .db-integration-base
  services:
    - name: postgres:15
      alias: postgres
      variables:
        POSTGRES_DB: wasla_channel_e2e
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
  variables:
    DATABASE_URL: "postgres://postgres:postgres@postgres:5432/wasla_channel_e2e"
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter @wasla/channel-e2e test

# ──────────────────────────────────────────────────────────────
# بوابة خروج المرحلة 04 (MR 6/6) — سؤال واحد: «عميل ينشئ Order صالحاً
# ويصل إلى محرّك الطلبات دون Matching فعلي»:
#   packages/customer-e2e/src/__tests__/phase04-exit-gate.e2e.test.ts
#
# الملف نفسه يعمل داخل build-test بمخازن in-memory — فالبوابة يجب أن تُثبَت
# على كل MR دون قاعدة بيانات — وهذه الوظيفة ترفعه على Postgres حقيقي عبر
# المتغيّر CUSTOMER_DATABASE_URL، فيصبح ما تضيفه هو ما لا تُثبته الذاكرة:
# أنّ صفّ الطلب ونقاطه يُكتبان فعلاً في معاملة واحدة، وأنّ فهرس
# Idempotency-Key يمنع طلباً ثانياً على مستوى المحرّك لا على مستوى الكائن.
#
# المتغيّر هو CUSTOMER_DATABASE_URL وليس DATABASE_URL بقصد: الثاني هو مخزن
# طبقة القناة (المرحلة 03)، ولو ضُبط هنا لحاول البوت استخدام جداول channel_*
# التي لا تملكها هذه البوابة، فيصبح الفشل منسوباً إلى غير سببه. مخازن
# القناة تبقى in-memory هنا، ولها بوابتها الخاصة (channel-exit-gate-e2e).
#
# قاعدة مستقلة (wasla_customer_e2e) حتى لا تتداخل مع customer-db-integration
# وليبقى الفشل منسوباً لوظيفة واحدة. خدمتا الهوية والجغرافيا تعملان داخل
# الاختبار بمحوّلات in-memory وتستمعان على منافذ عشوائية، فلا حاجة إلى
# مخطّطَيهما هنا (محلّ الفحص هو العقد بين الخدمات). محرّك الطلبات بديل
# (stub) يستمع على منفذ حقيقي ويرفض أي جسم لا يطابق OrderIntakeRequest.
# ──────────────────────────────────────────────────────────────
customer-exit-gate-e2e:
  extends: .db-integration-base
  services:
    - name: postgres:15
      alias: postgres
      variables:
        POSTGRES_DB: wasla_customer_e2e
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
  variables:
    CUSTOMER_DATABASE_URL: "postgres://postgres:postgres@postgres:5432/wasla_customer_e2e"
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter @wasla/customer-e2e test

# ──────────────────────────────────────────────────────────────
# بوابة خروج المرحلة 06 (MR 6/6) — سؤال واحد: «الطلب يعيش دورة حياته كاملة
# في المحرّك، ولا يصل طلب أبداً إلى حالة يمنعها الجدول المنشور»:
#   packages/order-e2e/src/__tests__/phase06-exit-gate.e2e.test.ts
#
# ما تُثبته هذه البوابة أنّ خدمتين منفصلتين تعملان معاً: نواة العميل تُسلّم
# النيّة إلى المحرّك عبر المحوّل الإنتاجي نفسه (HttpOrderIntakePort من MR 5/6)
# لا عبر نسخة منه، ثم يُقاد الطلب عبر HTTP من published إلى completed، ثم
# يُمسح فضاء الانتقالات كاملاً: 21×21 = 441 زوجاً، تنجح منها 72 حافة منشورة
# وتُرفض 369 بالرمز ORDER_ILLEGAL_TRANSITION مع بقاء الطلب في مكانه.
#
# الملف نفسه يعمل داخل build-test بمخزن ذاكرة للمحرّك — فالبوابة يجب أن
# تُثبَت على كل MR دون قاعدة بيانات — وهذه الوظيفة ترفعه على Postgres حقيقي،
# فيصبح ما تضيفه هو ما لا تُثبته الذاكرة: أنّ كل انتقال يكتب صفّ الحالة وصفّ
# السجل والحدث في معاملة واحدة عبر PostgresOrderUnitOfWork، وأنّ المُعرّف
# العام ORD-########## يأتي من التسلسل order_public_id_seq في القاعدة نفسها،
# وأنّ /health يقول ok بدل degraded لأنّ التخزين صار دائماً.
#
# المتغيّر هو ORDER_DATABASE_URL وليس DATABASE_URL بقصد: الثاني هو مخزن طبقة
# القناة (المرحلة 03) ومخزن وظائف تكامل المحرّك نفسها، ولو ضُبط هنا لتداخلت
# البوابة مع جداول لا تملكها فيصبح الفشل منسوباً إلى غير سببه. مخزن العميل
# يبقى in-memory هنا بإعلان صريح: سؤال «هل يُكتب صفّ الطلب ونقاطه في معاملة
# واحدة؟» تملكه بوابة المرحلة 04 (customer-exit-gate-e2e)، وتكراره هنا يضاعف
# سطح الفشل دون أن يضيف معلومة.
#
# قاعدة مستقلة (wasla_order_e2e) حتى لا تتداخل مع order-db-integration وليبقى
# الفشل منسوباً لوظيفة واحدة. خدمتا الهوية والجغرافيا تعملان داخل الاختبار
# بمحوّلات in-memory وتستمعان على منافذ عشوائية (محلّ الفحص هو العقد بين
# الخدمات لا مخطّطاتها). لا قناة ولا بوت هنا، ولا Matching: الإسنادات تُسجَّل
# من الاختبار كما ستُسجّلها المرحلة 07، لأنّ المحرّك يسجّل الإسناد ولا يقرّره
# (ADR-010).
#
# التفصيل: docs/12-testing/PHASE06_EXIT_GATE_E2E.md
# ──────────────────────────────────────────────────────────────
order-exit-gate-e2e:
  extends: .db-integration-base
  services:
    - name: postgres:15
      alias: postgres
      variables:
        POSTGRES_DB: wasla_order_e2e
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
  variables:
    ORDER_DATABASE_URL: "postgres://postgres:postgres@postgres:5432/wasla_order_e2e"
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter @wasla/order-e2e test

# ──────────────────────────────────────────────────────────────
# بوابة خروج المرحلة 07 (MR 6/6) — سؤال واحد: «طلب حقيقي يجد سائقاً حقيقياً،
# عرضاً بعد عرض وموجة بعد موجة، عبر ست خدمات مستقلّة على HTTP حقيقي، ولا يصل
# أبداً إلى حالة يمنعها أحد جداولها المنشورة»:
#   packages/dispatch-e2e/src/__tests__/phase07-exit-gate.e2e.test.ts
#
# أربعة مسارات، كلٌّ منها نهاية يجب أن تكون قابلة للوصول وقابلة للإثبات:
# سائق يُوجد (رفض ثم موجة تستثني الرافض ثم قبول، فيصبح الطلب accepted مربوطاً
# بالسائق وإسقاط الجهوزية busy)، وسائق يصمت (انقضاء مهلة بساعة محقونة بلا أي
# انتظار حقيقي)، ولا أحد متاح (تصعيد إلى المجتمع والطلب لا يزال searching، ثم
# نفاد و no_driver_found بعد نافذة التصعيد)، وسائقان لطلب واحد (الفائز
# accepted والخاسر superseded لا rejected، لأنّه لم يقل «لا» أصلاً).
#
# الملف نفسه يعمل داخل build-test بمخازن in-memory — فالبوابة يجب أن تُثبَت
# على كل MR دون قاعدة بيانات — وهذه الوظيفة ترفع خدمتَي المطابقة والتوزيع
# معاً على Postgres حقيقي، فيصبح ما تضيفه هو ما لا تُثبته الذاكرة: أنّ فهرس
# ux_dispatch_offers_one_accepted_job يمنع قبولاً ثانياً على مستوى المحرّك لا
# على مستوى الكائن، وأنّ ux_dispatch_waves_one_open_job يمنع موجتين مفتوحتين
# لمهمّة واحدة، وأنّ المواعيد المحفوظة (expires_at و escalation_expires_at)
# تُقرأ من القاعدة كما كُتبت لا من حساب ثانٍ في الذاكرة، وأنّ /health يقول ok
# بدل degraded لأنّ التخزين صار دائماً.
#
# المتغيّر هو DISPATCH_DATABASE_URL وليس DATABASE_URL بقصد: الثاني هو مخزن
# طبقة القناة (المرحلة 03)، ولو ضُبط هنا لحاولت مكوّنات أخرى استخدام جداول
# channel_* التي لا تملكها هذه البوابة فيصبح الفشل منسوباً إلى غير سببه.
# المتغيّر الواحد يرفع المطابقة والتوزيع على القاعدة نفسها لأنّ سؤال البوابة
# هو العقد بينهما، ولأنّ لكل خدمة بادئة جداولها الخاصة (matching_* مقابل
# dispatch_*) فلا تتداخل الأسماء.
#
# ما يبقى in-memory هنا بإعلان صريح: محرّك الطلبات ونواة العميل. سؤال «هل
# يُكتب كل انتقال في معاملة واحدة؟» تملكه بوابة المرحلة 06
# (order-exit-gate-e2e)، وسؤال «هل يُكتب صفّ الطلب ونقاطه معاً؟» تملكه بوابة
# المرحلة 04 (customer-exit-gate-e2e)، وتكرارهما هنا يضاعف سطح الفشل دون أن
# يضيف معلومة. المحرّك هنا هو المحرّك الإنتاجي نفسه عبر HTTP، وما يتغيّر هو
# مخزنه فقط.
#
# قاعدة مستقلة (wasla_dispatch_e2e) حتى لا تتداخل مع matching-db-integration
# ولا dispatch-db-integration وليبقى الفشل منسوباً لوظيفة واحدة. خدمتا الهوية
# والجغرافيا تعملان داخل الاختبار بمحوّلات in-memory وتستمعان على منافذ
# عشوائية (محلّ الفحص هو العقد بين الخدمات لا مخطّطاتها).
#
# التفصيل: docs/12-testing/PHASE07_EXIT_GATE_E2E.md
# ──────────────────────────────────────────────────────────────
dispatch-exit-gate-e2e:
  extends: .db-integration-base
  services:
    - name: postgres:15
      alias: postgres
      variables:
        POSTGRES_DB: wasla_dispatch_e2e
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
  variables:
    DISPATCH_DATABASE_URL: "postgres://postgres:postgres@postgres:5432/wasla_dispatch_e2e"
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter @wasla/dispatch-e2e test

# ──────────────────────────────────────────────────────────────
# بوابة خروج المرحلة 05 — نواة السائق على Postgres حقيقي
#
# السؤال الذي تملكه هذه الوظيفة وحدها: «سائق يُسجَّل ويُراجَع فيصير مؤهَّلاً
# بأهليّة **محسوبة**، فيصله عرض حقيقي من التوزيع، ثم تنتهي وثيقته بنبضة
# واحدة فيخرج من التجمّع». وهو سؤال لا تجيب عنه أي وظيفة أخرى: اختبارات
# خدمة السائقين تُثبت الحساب داخل الخدمة، لكنها لا تُثبت أنّ ما يخرج منها
# يصل المطابقة بشكل يفهمه التوزيع فيبني عليه عرضاً.
#
# الملف نفسه يعمل داخل build-test بمخازن in-memory — فالبوابة تُثبَت على كل
# MR دون قاعدة بيانات — وهذه الوظيفة ترفع نواة السائق وحدها على Postgres.
# ما تضيفه القاعدة هنا محدَّد: أنّ eligibility_recheck_at يُقرأ من فهرس
# حقيقي في listDueForRecheck لا من مسح ذاكرة، فتصدق دعوى «نبضة واحدة»؛ وأنّ
# صفوف driver_candidacy_publications تُكتب فعلاً فيبقى للتدقيق أثرٌ بعد
# انتهاء العملية؛ وأنّ /health يقول ok بدل degraded لأنّ التخزين صار دائماً.
#
# المتغيّر هو DRIVER_DATABASE_URL وليس DATABASE_URL بقصد، للسبب نفسه المشروح
# في بوابة المرحلة 07: الثاني هو مخزن طبقة القناة (المرحلة 03).
#
# ما يبقى in-memory هنا بإعلان صريح: المطابقة والتوزيع والطلبات والعملاء
# والهوية والجغرافيا. أسئلة متانتها تملكها بواباتها (04 و06 و07)، وتكرارها
# هنا يضاعف سطح الفشل دون أن يضيف معلومة. الخدمات كلّها هي الإنتاجية نفسها
# عبر HTTP على منافذ عشوائية، وما يتغيّر هو مخزن نواة السائق فقط.
#
# قاعدة مستقلة (wasla_driver_e2e) حتى لا تتداخل مع drivers-db-integration
# وليبقى الفشل منسوباً لوظيفة واحدة.
#
# التفصيل: docs/12-testing/PHASE05_EXIT_GATE_E2E.md
# ──────────────────────────────────────────────────────────────
driver-exit-gate-e2e:
